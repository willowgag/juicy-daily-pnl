<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P&L Dashboard</title>
<style>
  :root {
    --font-display: 'DM Mono', 'SF Mono', 'Consolas', monospace;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  /* Dark theme — black-to-purple gradient, violet accent, lavender/gray pos-neg */
  html[data-theme="dark"] {
    --bg: #1a0f2e;
    --bg-gradient: linear-gradient(180deg, #0a0612 0%, #1a0f2e 50%, #2b1650 100%);
    --panel: rgba(255,255,255,0.05);
    --panel-raised: rgba(255,255,255,0.12);
    --panel-border: rgba(178,143,224,0.22);
    --text: #e8e4f0;
    --text-dim: #9d97ae;
    --pos-bg: rgba(144,120,196,0.16);
    --pos-text: #9078C4;
    --neg-bg: rgba(156,148,175,0.18);
    --neg-text: #9C94AF;
    --neutral-bg: rgba(255,255,255,0.03);
    --accent: #a374d6;
    --accent-text: #170a26;
    --modal-overlay: rgba(5,2,10,0.7);
    --nav-bg: #0d0818;
    --warn-text: #d4b483;
    --panel-solid: #221640;
  }

  /* Light theme — cream / near-black text / soft blue accent, exact hex from reference */
  html[data-theme="light"] {
    --bg: #D9CCBC;
    --bg-gradient: none;
    --panel: #EFE8DE;
    --panel-raised: #ffffff;
    --panel-border: #c5b8a4;
    --text: #464542;
    --text-dim: #7a7568;
    --pos-bg: #e8e2f2;
    --pos-text: #6a4fa0;
    --neg-bg: #e3e0e8;
    --neg-text: #6b6478;
    --neutral-bg: #e0d5c4;
    --accent: #ABC4E9;
    --accent-text: #1c2a3d;
    --modal-overlay: rgba(70,69,66,0.35);
    --nav-bg: #E4D9C9;
    --warn-text: #8a7a4a;
    --panel-solid: #ffffff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg-gradient) var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    padding: 20px;
    min-height: 100vh;
    background-attachment: fixed;
    transition: background 0.2s, color 0.2s;
  }

  .wrap {
    max-width: 1100px;
    margin: 0 auto;
    transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
  }

  body.nav-open .wrap { transform: translateX(180px); }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 18px;
  }

  .header-left { display: flex; align-items: center; gap: 12px; }

  .nav-toggle {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text);
    width: 36px;
    height: 36px;
    border-radius: 9px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    flex-shrink: 0;
  }

  .nav-toggle span {
    display: block;
    width: 15px;
    height: 2px;
    background: var(--text);
    border-radius: 1px;
    transition: transform 0.2s, opacity 0.2s;
  }

  body.nav-open .nav-toggle span:nth-child(1) { transform: translateY(5px) rotate(45deg); }
  body.nav-open .nav-toggle span:nth-child(2) { opacity: 0; }
  body.nav-open .nav-toggle span:nth-child(3) { transform: translateY(-5px) rotate(-45deg); }

  h1 {
    font-family: var(--font-display);
    font-size: 19px;
    font-weight: 500;
    letter-spacing: -0.02em;
    margin: 0;
    color: var(--text);
  }

  .current-view-label {
    font-size: 12px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .header-right { display: flex; align-items: center; gap: 10px; }

  .theme-toggle {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text);
    width: 36px;
    height: 36px;
    border-radius: 9px;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .theme-toggle:hover { border-color: var(--accent); }

  .nav-panel {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    width: 190px;
    background: var(--nav-bg);
    border-right: 1px solid var(--panel-border);
    padding: 24px 14px;
    transform: translateX(-100%);
    transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    z-index: 200;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  body.nav-open .nav-panel { transform: translateX(0); }

  .nav-panel-title {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    padding: 0 10px 12px;
  }

  .nav-item {
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 600;
    text-align: left;
    padding: 10px 12px;
    border-radius: 8px;
    background: transparent;
    color: var(--text-dim);
    border: none;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }

  .nav-item:hover { background: var(--panel-border); color: var(--text); }
  .nav-item.active { background: var(--accent); color: var(--accent-text); }

  .nav-scrim {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.25);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.28s;
    z-index: 150;
  }

  body.nav-open .nav-scrim { opacity: 1; pointer-events: auto; }

  .view { display: none; }
  .view.active { display: block; }

  .toolbar-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 18px;
  }

  .roas-health-pill {
    display: inline-flex;
    align-items: center;
    font-size: 11px;
    font-weight: 700;
    padding: 5px 11px;
    border-radius: 999px;
    letter-spacing: 0.02em;
  }

  .roas-health-pill:empty { display: none; }

  .roas-health-pill.excellent { background: rgba(80,140,220,0.16); color: #4f8cdc; }
  .roas-health-pill.good { background: var(--pos-bg); color: var(--pos-text); }
  .roas-health-pill.fair { background: rgba(212,180,60,0.16); color: var(--warn-text); }
  .roas-health-pill.bad { background: var(--neg-bg); color: var(--neg-text); }

  .brand-picker { position: relative; width: fit-content; }

  .brand-picker-button {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 600;
    padding: 9px 14px;
    border-radius: 10px;
    cursor: pointer;
  }

  .brand-picker-button:hover { border-color: var(--accent); }
  .brand-picker-caret { font-size: 10px; color: var(--text-dim); transition: transform 0.15s; }
  .brand-picker.open .brand-picker-caret { transform: rotate(180deg); }

  .brand-picker-menu {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    background: var(--panel-raised);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 6px;
    min-width: 160px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    display: none;
    z-index: 250;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
  }

  .brand-picker.open .brand-picker-menu { display: block; }

  #brandPickerScrim {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.2);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    z-index: 240;
  }

  #brandPickerScrim.active { opacity: 1; pointer-events: auto; }

  .brand-picker-item {
    display: block;
    width: 100%;
    text-align: left;
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 600;
    padding: 8px 10px;
    border-radius: 7px;
    background: transparent;
    color: var(--text-dim);
    border: none;
    cursor: pointer;
  }

  .brand-picker-item:hover { background: var(--neutral-bg); color: var(--text); }
  .brand-picker-item.active { background: var(--accent); color: var(--accent-text); }

  .date-range-inline {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .date-range-inline input[type="date"] {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text);
    border-radius: 8px;
    padding: 7px 9px;
    font-family: var(--font-body);
    font-size: 12px;
  }

  .date-range-inline button {
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    border-radius: 8px;
    padding: 7px 12px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }

  .date-range-inline .date-sep { font-size: 12px; color: var(--text-dim); }

  /* Single-window calendar range picker: click a start day, click an end day */
  .range-picker { position: relative; width: fit-content; }

  .range-picker-button {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 600;
    padding: 9px 14px;
    border-radius: 10px;
    cursor: pointer;
  }

  .range-picker-button:hover { border-color: var(--accent); }

  .range-picker-popover {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    background: var(--panel-solid);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 14px;
    width: 280px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    display: none;
    z-index: 250;
  }

  .range-picker.open .range-picker-popover { display: block; }

  .range-picker-presets {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-bottom: 12px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--panel-border);
  }

  .range-picker-preset {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text-dim);
    font-size: 11px;
    font-weight: 600;
    padding: 5px 9px;
    border-radius: 7px;
    cursor: pointer;
  }

  .range-picker-preset:hover { color: var(--text); border-color: var(--accent); }
  .range-picker-preset.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }

  .range-picker-month-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }

  .range-picker-month-nav button {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 14px;
    padding: 2px 6px;
  }

  .range-picker-month-nav button:hover { color: var(--text); }
  .range-picker-month-label { font-size: 12px; font-weight: 600; }

  .range-picker-weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    margin-bottom: 4px;
  }

  .range-picker-weekdays div {
    text-align: center;
    font-size: 9px;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  .range-picker-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
  }

  .range-picker-day {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    border-radius: 6px;
    cursor: pointer;
    color: var(--text);
    background: transparent;
    border: none;
  }

  .range-picker-day:hover { background: var(--neutral-bg); }
  .range-picker-day.empty { cursor: default; visibility: hidden; }
  .range-picker-day.in-range { background: var(--pos-bg); border-radius: 0; }
  .range-picker-day.range-start,
  .range-picker-day.range-end {
    background: var(--accent);
    color: var(--accent-text);
    font-weight: 600;
  }
  .range-picker-day.range-start { border-radius: 6px 0 0 6px; }
  .range-picker-day.range-end { border-radius: 0 6px 6px 0; }
  .range-picker-day.range-start.range-end { border-radius: 6px; }

  #rangePickerScrim {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.2);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    z-index: 240;
  }

  #rangePickerScrim.active { opacity: 1; pointer-events: auto; }

  .summary-bar {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }

  .stat {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 14px 16px;
    min-width: 0;
  }

  .stat-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    margin-bottom: 6px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .stat-value {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 500;
    overflow-wrap: break-word;
  }

  .stat-value.pos { color: var(--pos-text); }
  .stat-value.neg { color: var(--neg-text); }

  .month-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-bottom: 14px;
  }

  .month-nav button {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text);
    width: 32px;
    height: 32px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .month-nav button:hover { background: var(--neutral-bg); }

  .month-label {
    font-family: var(--font-display);
    font-size: 15px;
    min-width: 160px;
    text-align: center;
  }

  .calendar {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    overflow: hidden;
  }

  .weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    border-bottom: 1px solid var(--panel-border);
  }

  .weekdays div {
    padding: 10px;
    text-align: center;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
  }

  .grid { display: grid; grid-template-columns: repeat(7, 1fr); }

  .day {
    min-height: 78px;
    border-right: 1px solid var(--panel-border);
    border-bottom: 1px solid var(--panel-border);
    padding: 8px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    cursor: default;
    transition: filter 0.1s;
    min-width: 0;
    overflow: hidden;
  }

  .day:nth-child(7n) { border-right: none; }
  .day.empty { background: transparent; cursor: default; }
  .day.no-data { background: var(--neutral-bg); }
  .day.pos { background: var(--pos-bg); }
  .day.neg { background: var(--neg-bg); }
  .day.pos, .day.neg { cursor: pointer; }
  .day.pos:hover, .day.neg:hover { filter: brightness(1.15); }
  html[data-theme="light"] .day.pos:hover,
  html[data-theme="light"] .day.neg:hover { filter: brightness(0.97); }

  .day-num { font-size: 11px; color: var(--text-dim); }

  .day-value {
    font-family: var(--font-display);
    font-size: 14px;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .day.pos .day-value { color: var(--pos-text); }
  .day.neg .day-value { color: var(--neg-text); }

  .day-orders {
    font-size: 10px;
    color: var(--text-dim);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .range-panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 16px 18px;
    margin-top: 24px;
  }

  .range-panel-title {
    font-family: var(--font-display);
    font-size: 13px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 12px;
  }

  .range-controls {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }

  .range-controls label { font-size: 12px; color: var(--text-dim); }

  .range-controls input[type="date"] {
    background: var(--bg);
    border: 1px solid var(--panel-border);
    color: var(--text);
    border-radius: 7px;
    padding: 6px 10px;
    font-family: var(--font-body);
    font-size: 13px;
    min-width: 0;
  }

  .range-controls button {
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    border-radius: 7px;
    padding: 7px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }

  .range-summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: var(--modal-overlay);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 300;
    padding: 20px;
  }

  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--panel-raised);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 20px 22px;
    max-width: 380px;
    width: 100%;
  }

  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .modal-date { font-family: var(--font-display); font-size: 15px; }

  .modal-close {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 18px;
    cursor: pointer;
    line-height: 1;
    padding: 4px;
  }

  .modal-close:hover { color: var(--text); }

  .modal-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid var(--panel-border);
    font-size: 13px;
    gap: 12px;
  }

  .modal-row:last-child { border-bottom: none; }
  .modal-row-label { color: var(--text-dim); }
  .modal-row-value { font-family: var(--font-display); font-weight: 600; text-align: right; }
  .modal-row-value.pos { color: var(--pos-text); }
  .modal-row-value.neg { color: var(--neg-text); }

  .ebitda-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }

  .ebitda-tile {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 18px 20px;
    min-width: 0;
  }

  .ebitda-tile-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .ebitda-tile-icon { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }

  .ebitda-tile-value {
    font-family: var(--font-display);
    font-size: 26px;
    font-weight: 600;
    overflow-wrap: break-word;
  }

  .ebitda-tile-value.pos { color: var(--pos-text); }
  .ebitda-tile-value.neg { color: var(--neg-text); }
  .ebitda-tile-sub { font-size: 12px; color: var(--text-dim); margin-top: 6px; }

  .ebitda-tile.featured {
    grid-column: span 3;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }

  .ebitda-tile.featured .ebitda-tile-value { font-size: 34px; }

  /* Meta Ads clickable tiles */
  .meta-tile {
    cursor: pointer;
    transition: border-color 0.15s, transform 0.1s;
  }

  .meta-tile:hover { border-color: var(--accent); transform: translateY(-1px); }

  .meta-tile-trend {
    font-size: 11px;
    margin-top: 6px;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .meta-tile-trend.up { color: var(--pos-text); }
  .meta-tile-trend.down { color: var(--neg-text); }

  .chart-modal-body { padding: 4px 0; }
  .chart-modal { background: var(--panel-solid); }
  .chart-svg-wrap { width: 100%; overflow: visible; position: relative; }

  .annual-table-wrap {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    overflow-x: auto;
  }

  table.annual-table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 560px; }

  table.annual-table th,
  table.annual-table td {
    padding: 10px 14px;
    text-align: right;
    border-bottom: 1px solid var(--panel-border);
    white-space: nowrap;
  }

  table.annual-table th:first-child,
  table.annual-table td:first-child { text-align: left; font-family: var(--font-display); }

  table.annual-table th {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-dim);
    font-weight: 600;
    background: var(--neutral-bg);
  }

  table.annual-table tr:last-child td { border-bottom: none; }
  td.pos { color: var(--pos-text); }
  td.neg { color: var(--neg-text); }

  footer { margin-top: 20px; text-align: center; font-size: 11px; color: var(--text-dim); }

  @media (max-width: 640px) {
    body { padding: 10px; }
    header { gap: 8px; margin-bottom: 12px; }
    h1 { font-size: 15px; }
    .current-view-label { font-size: 10px; }
    .header-right { gap: 6px; }
    .nav-toggle, .theme-toggle { width: 32px; height: 32px; }

    body.nav-open .wrap { transform: translateX(150px); }
    .nav-panel { width: 160px; padding: 20px 10px; }
    .nav-item { font-size: 13px; padding: 9px 10px; }

    .brand-picker-button { padding: 8px 12px; font-size: 13px; }
    .toolbar-row { flex-direction: column; align-items: flex-start; }
    .date-range-inline input[type="date"] { flex: 1 1 100px; font-size: 11px; padding: 6px; }
    .date-range-inline button { font-size: 11px; padding: 6px 10px; }

    .summary-bar, .range-summary { grid-template-columns: repeat(2, 1fr); gap: 6px; }
    .stat { padding: 9px 10px; }
    .stat-label { font-size: 10px; }
    .stat-value { font-size: 15px; }

    .month-nav { gap: 8px; margin-bottom: 8px; }
    .month-label { font-size: 12px; min-width: 100px; }

    .weekdays div { padding: 5px 1px; font-size: 8px; }

    .day { min-height: 48px; padding: 3px; }
    .day-num { font-size: 8px; }
    .day-value { font-size: 10px; }
    .day-orders { font-size: 7px; }

    .range-panel { padding: 10px; margin-top: 12px; }
    .range-controls { gap: 5px; }
    .range-controls label { font-size: 10px; }
    .range-controls input[type="date"] { padding: 5px 4px; font-size: 11px; flex: 1 1 100px; }
    .range-controls button { padding: 6px 9px; font-size: 11px; }

    .modal { max-width: 100%; padding: 14px 16px; }

    .ebitda-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .ebitda-tile { padding: 12px 14px; }
    .ebitda-tile-value { font-size: 19px; }
    .ebitda-tile.featured { grid-column: span 2; }
    .ebitda-tile.featured .ebitda-tile-value { font-size: 24px; }
  }

  @media (max-width: 380px) {
    .day { min-height: 40px; }
    .day-value { font-size: 9px; }
    .day-orders { display: none; }
  }
</style>
</head>
<body>
<div class="nav-scrim" id="navScrim"></div>
<div id="brandPickerScrim"></div>
<div id="rangePickerScrim"></div>
<div class="nav-panel" id="navPanel">
  <div class="nav-panel-title">Views</div>
  <button class="nav-item active" data-view="calendar">Calendar</button>
  <button class="nav-item" data-view="ebitda">EBITDA</button>
  <button class="nav-item" data-view="annual">Annual</button>
  <button class="nav-item" data-view="payouts">Payouts</button>
  <button class="nav-item" data-view="metaads">Meta Ads</button>
  <button class="nav-item" data-view="shares">Shares</button>
</div>

<div class="wrap">
  <header>
    <div class="header-left">
      <button class="nav-toggle" id="navToggle" title="Menu">
        <span></span><span></span><span></span>
      </button>
      <div>
        <h1>P&L Dashboard</h1>
        <div class="current-view-label" id="currentViewLabel">Calendar</div>
      </div>
    </div>
    <div class="header-right">
      <button class="theme-toggle" id="themeToggle" title="Toggle theme">&#9789;</button>
    </div>
  </header>

  <div class="view active" id="view-calendar">
    <div class="brand-picker" id="brandPicker-calendar">
      <button class="brand-picker-button" data-menu="calendar">
        <span data-label>Blended</span>
        <span class="brand-picker-caret">&#9662;</span>
      </button>
      <div class="brand-picker-menu" id="brandMenu-calendar"></div>
    </div>

    <div class="summary-bar" id="summary" style="margin-top:16px;"></div>

    <div class="month-nav">
      <button id="prevMonth">&#8249;</button>
      <div class="month-label" id="monthLabel"></div>
      <button id="nextMonth">&#8250;</button>
    </div>

    <div class="calendar">
      <div class="weekdays">
        <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
      </div>
      <div class="grid" id="grid"></div>
    </div>

    <div class="range-panel">
      <div class="range-panel-title">Custom Date Range</div>
      <div class="range-controls">
        <label for="rangeStart">From</label>
        <input type="date" id="rangeStart">
        <label for="rangeEnd">To</label>
        <input type="date" id="rangeEnd">
        <button id="rangeApply">Apply</button>
      </div>
      <div class="range-summary" id="rangeSummary"></div>
    </div>
  </div>

  <div class="view" id="view-ebitda">
    <div class="toolbar-row">
      <div class="brand-picker" id="brandPicker-ebitda">
        <button class="brand-picker-button" data-menu="ebitda">
          <span data-label>Blended</span>
          <span class="brand-picker-caret">&#9662;</span>
        </button>
        <div class="brand-picker-menu" id="brandMenu-ebitda"></div>
      </div>
      <div class="range-picker" id="rangePicker-ebitda">
        <button class="range-picker-button">
          <span data-label>This month</span>
          <span class="brand-picker-caret">&#9662;</span>
        </button>
        <div class="range-picker-popover" id="rangePopover-ebitda"></div>
      </div>
    </div>

    <div class="ebitda-grid" id="waterfall"></div>
  </div>

  <div class="view" id="view-annual">
    <div class="brand-picker" id="brandPicker-annual">
      <button class="brand-picker-button" data-menu="annual">
        <span data-label>Blended</span>
        <span class="brand-picker-caret">&#9662;</span>
      </button>
      <div class="brand-picker-menu" id="brandMenu-annual"></div>
    </div>

    <div class="annual-table-wrap" style="margin-top:16px;">
      <table class="annual-table" id="annualTable"></table>
    </div>
  </div>

  <div class="view" id="view-payouts">
    <div class="brand-picker" id="brandPicker-payouts">
      <button class="brand-picker-button" data-menu="payouts">
        <span data-label>Blended</span>
        <span class="brand-picker-caret">&#9662;</span>
      </button>
      <div class="brand-picker-menu" id="brandMenu-payouts"></div>
    </div>

    <div class="summary-bar" id="payoutsSummary" style="grid-template-columns: repeat(2, 1fr); max-width: 480px; margin-top:16px;"></div>

    <div class="range-panel-title" style="margin-top:24px;">Payout History</div>
    <div class="annual-table-wrap" style="margin-top:12px;">
      <table class="annual-table" id="payoutsHistoryTable"></table>
    </div>
  </div>

  <div class="view" id="view-metaads">
    <div class="toolbar-row">
      <div class="brand-picker" id="brandPicker-metaads">
        <button class="brand-picker-button" data-menu="metaads">
          <span data-label>Blended</span>
          <span class="brand-picker-caret">&#9662;</span>
        </button>
        <div class="brand-picker-menu" id="brandMenu-metaads"></div>
      </div>
      <span class="roas-health-pill" id="roasHealthPill" title="ROAS vs break-even, last 7 days"></span>
      <div class="range-picker" id="rangePicker-meta">
        <button class="range-picker-button">
          <span data-label>Last 30 days</span>
          <span class="brand-picker-caret">&#9662;</span>
        </button>
        <div class="range-picker-popover" id="rangePopover-meta"></div>
      </div>
    </div>

    <div class="ebitda-grid" id="metaAdsGrid"></div>
  </div>

  <div class="view" id="view-shares">
    <div class="summary-bar" id="sharesSummary" style="grid-template-columns: repeat(3, 1fr);"></div>

    <div class="range-panel-title" style="margin-top:24px;">Share by brand</div>
    <div class="annual-table-wrap" style="margin-top:12px;">
      <table class="annual-table" id="sharesBrandTable"></table>
    </div>

    <div class="range-panel" style="margin-top:24px;">
      <div class="range-panel-title">Log a payment</div>
      <div class="range-controls">
        <input type="date" id="sharePaymentDate">
        <input type="number" id="sharePaymentAmount" placeholder="Amount" step="0.01"
               style="background:var(--bg);border:1px solid var(--panel-border);color:var(--text);border-radius:7px;padding:6px 10px;font-family:var(--font-body);font-size:13px;width:110px;">
        <input type="text" id="sharePaymentNote" placeholder="Note (optional)"
               style="background:var(--bg);border:1px solid var(--panel-border);color:var(--text);border-radius:7px;padding:6px 10px;font-family:var(--font-body);font-size:13px;flex:1 1 140px;">
        <button id="sharePaymentSubmit">Add</button>
      </div>
      <div id="sharePaymentStatus" style="font-size:12px;color:var(--text-dim);"></div>
    </div>

    <div class="range-panel-title" style="margin-top:24px;">Payment history</div>
    <div class="annual-table-wrap" style="margin-top:12px;">
      <table class="annual-table" id="sharesPaymentsTable"></table>
    </div>
  </div>

  <footer>Updated automatically once a day from Juicy P&amp;L data</footer>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-date" id="modalDate"></div>
      <button class="modal-close" id="modalClose">&times;</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<div class="modal-overlay" id="chartModalOverlay">
  <div class="modal chart-modal" style="max-width:560px;">
    <div class="modal-header">
      <div class="modal-date" id="chartModalTitle"></div>
      <button class="modal-close" id="chartModalClose">&times;</button>
    </div>
    <div class="chart-modal-body">
      <div class="chart-svg-wrap" id="chartSvgWrap"></div>
    </div>
  </div>
</div>

<script src="dashboard.js"></script>
</body>
</html>
