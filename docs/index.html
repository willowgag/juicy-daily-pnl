<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P&L Dashboard</title>
<style>
  :root {
    --font-display: 'DM Mono', 'SF Mono', 'Consolas', monospace;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  /* Dark theme (default) — purple accent */
  html[data-theme="dark"] {
    --bg: #0b0d10;
    --panel: #14171b;
    --panel-border: #23272d;
    --text: #e8eaed;
    --text-dim: #8b929c;
    --green-bg: #10221a;
    --green-text: #4ade80;
    --red-bg: #26141a;
    --red-text: #f87171;
    --neutral-bg: #17191d;
    --accent: #9b6bff;
    --accent-text: #fff;
    --modal-overlay: rgba(0,0,0,0.6);
  }

  /* Light theme — beige / black text / orange accent */
  html[data-theme="light"] {
    --bg: #f2ebe0;
    --panel: #faf6ee;
    --panel-border: #e0d5c0;
    --text: #1c1a17;
    --text-dim: #7a7266;
    --green-bg: #e8f2e2;
    --green-text: #3f7d2c;
    --red-bg: #f7e6df;
    --red-text: #b8452c;
    --neutral-bg: #ece3d4;
    --accent: #e2711d;
    --accent-text: #fff;
    --modal-overlay: rgba(28,26,23,0.35);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    padding: 24px;
    min-height: 100vh;
    transition: background 0.2s, color 0.2s;
  }

  .wrap {
    max-width: 1100px;
    margin: 0 auto;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 16px;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  h1 {
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 500;
    letter-spacing: -0.02em;
    margin: 0;
    color: var(--text);
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .theme-toggle {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text);
    width: 34px;
    height: 34px;
    border-radius: 9px;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .theme-toggle:hover { border-color: var(--accent); }

  /* Top-level view switcher (Calendar / EBITDA / Annual) */
  .view-switcher {
    display: flex;
    gap: 4px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 4px;
    margin-bottom: 14px;
    width: fit-content;
  }

  .view-tab {
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 600;
    padding: 8px 16px;
    border-radius: 7px;
    background: transparent;
    color: var(--text-dim);
    border: none;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    white-space: nowrap;
  }

  .view-tab:hover { color: var(--text); }

  .view-tab.active {
    background: var(--accent);
    color: var(--accent-text);
  }

  .view { display: none; }
  .view.active { display: block; }

  /* Brand tabs (within a view) */
  .tabs {
    display: flex;
    gap: 4px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 4px;
    flex-wrap: wrap;
  }

  .tab {
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 600;
    padding: 7px 14px;
    border-radius: 7px;
    background: transparent;
    color: var(--text-dim);
    border: none;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    white-space: nowrap;
  }

  .tab:hover { color: var(--text); }

  .tab.active {
    background: var(--accent);
    color: var(--accent-text);
  }

  .summary-bar {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }

  .stat {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 14px 16px;
    min-width: 0;
  }

  .stat-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    margin-bottom: 6px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .stat-value {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 500;
    overflow-wrap: break-word;
  }

  .stat-value.pos { color: var(--green-text); }
  .stat-value.neg { color: var(--red-text); }

  .month-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-bottom: 14px;
  }

  .month-nav button {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text);
    width: 32px;
    height: 32px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .month-nav button:hover { background: var(--neutral-bg); }

  .month-label {
    font-family: var(--font-display);
    font-size: 15px;
    min-width: 160px;
    text-align: center;
  }

  .calendar {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    overflow: hidden;
  }

  .weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    border-bottom: 1px solid var(--panel-border);
  }

  .weekdays div {
    padding: 10px;
    text-align: center;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
  }

  .day {
    min-height: 78px;
    border-right: 1px solid var(--panel-border);
    border-bottom: 1px solid var(--panel-border);
    padding: 8px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    cursor: default;
    transition: filter 0.1s;
    min-width: 0;
    overflow: hidden;
  }

  .day:nth-child(7n) { border-right: none; }

  .day.empty { background: transparent; cursor: default; }
  .day.no-data { background: var(--neutral-bg); }

  .day.pos { background: var(--green-bg); }
  .day.neg { background: var(--red-bg); }

  .day.pos, .day.neg { cursor: pointer; }
  .day.pos:hover, .day.neg:hover { filter: brightness(0.93); }
  html[data-theme="light"] .day.pos:hover,
  html[data-theme="light"] .day.neg:hover { filter: brightness(0.97); }

  .day-num {
    font-size: 11px;
    color: var(--text-dim);
  }

  .day-value {
    font-family: var(--font-display);
    font-size: 14px;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .day.pos .day-value { color: var(--green-text); }
  .day.neg .day-value { color: var(--red-text); }

  .day-orders {
    font-size: 10px;
    color: var(--text-dim);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .range-panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 16px 18px;
    margin-top: 24px;
  }

  .range-panel-title {
    font-family: var(--font-display);
    font-size: 13px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 12px;
  }

  .range-controls {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }

  .range-controls label {
    font-size: 12px;
    color: var(--text-dim);
  }

  .range-controls input[type="date"] {
    background: var(--bg);
    border: 1px solid var(--panel-border);
    color: var(--text);
    border-radius: 7px;
    padding: 6px 10px;
    font-family: var(--font-body);
    font-size: 13px;
    min-width: 0;
  }

  .range-controls button {
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    border-radius: 7px;
    padding: 7px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }

  .range-summary {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: var(--modal-overlay);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }

  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 20px 22px;
    max-width: 340px;
    width: 100%;
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }

  .modal-date {
    font-family: var(--font-display);
    font-size: 15px;
  }

  .modal-close {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 18px;
    cursor: pointer;
    line-height: 1;
    padding: 4px;
  }

  .modal-close:hover { color: var(--text); }

  .modal-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid var(--panel-border);
    font-size: 13px;
    gap: 12px;
  }

  .modal-row:last-child { border-bottom: none; }

  .modal-row-label { color: var(--text-dim); }
  .modal-row-value { font-family: var(--font-display); font-weight: 600; text-align: right; }
  .modal-row-value.pos { color: var(--green-text); }
  .modal-row-value.neg { color: var(--red-text); }

  /* EBITDA waterfall */
  .waterfall {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 20px;
  }

  .waterfall-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--panel-border);
  }

  .waterfall-row:last-child { border-bottom: none; }

  .waterfall-label {
    font-size: 13px;
    color: var(--text-dim);
    width: 130px;
    flex-shrink: 0;
  }

  .waterfall-bar-track {
    flex: 1;
    background: var(--neutral-bg);
    border-radius: 6px;
    height: 22px;
    overflow: hidden;
    min-width: 0;
  }

  .waterfall-bar-fill {
    height: 100%;
    border-radius: 6px;
    transition: width 0.3s;
  }

  .waterfall-bar-fill.revenue { background: var(--accent); }
  .waterfall-bar-fill.deduction { background: var(--red-text); }
  .waterfall-bar-fill.final { background: var(--green-text); }

  .waterfall-value {
    font-family: var(--font-display);
    font-size: 13px;
    font-weight: 600;
    width: 90px;
    text-align: right;
    flex-shrink: 0;
  }

  /* Annual summary table */
  .annual-table-wrap {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    overflow-x: auto;
  }

  table.annual-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    min-width: 640px;
  }

  table.annual-table th,
  table.annual-table td {
    padding: 10px 14px;
    text-align: right;
    border-bottom: 1px solid var(--panel-border);
    white-space: nowrap;
  }

  table.annual-table th:first-child,
  table.annual-table td:first-child {
    text-align: left;
    font-family: var(--font-display);
  }

  table.annual-table th {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-dim);
    font-weight: 600;
  }

  table.annual-table tr:last-child td { border-bottom: none; }

  table.annual-table tr.total-row td {
    font-weight: 700;
    border-top: 2px solid var(--panel-border);
  }

  td.pos { color: var(--green-text); }
  td.neg { color: var(--red-text); }

  footer {
    margin-top: 20px;
    text-align: center;
    font-size: 11px;
    color: var(--text-dim);
  }

  @media (max-width: 640px) {
    body { padding: 10px; }
    header { gap: 8px; margin-bottom: 12px; }
    h1 { font-size: 16px; }
    .header-right { gap: 6px; }

    .view-switcher { margin-bottom: 10px; }
    .view-tab { padding: 7px 11px; font-size: 12px; }

    .tabs { gap: 3px; }
    .tab { padding: 6px 9px; font-size: 11px; }
    .theme-toggle { width: 30px; height: 30px; font-size: 14px; }

    .summary-bar, .range-summary { grid-template-columns: repeat(2, 1fr); gap: 6px; }
    .stat { padding: 9px 10px; }
    .stat-label { font-size: 10px; }
    .stat-value { font-size: 15px; }

    .month-nav { gap: 8px; margin-bottom: 8px; }
    .month-label { font-size: 12px; min-width: 100px; }

    .weekdays div { padding: 5px 1px; font-size: 8px; }

    .day { min-height: 48px; padding: 3px; }
    .day-num { font-size: 8px; }
    .day-value { font-size: 10px; }
    .day-orders { font-size: 7px; }

    .range-panel { padding: 10px; margin-top: 12px; }
    .range-controls { gap: 5px; }
    .range-controls label { font-size: 10px; }
    .range-controls input[type="date"] {
      padding: 5px 4px;
      font-size: 11px;
      flex: 1 1 100px;
    }
    .range-controls button { padding: 6px 9px; font-size: 11px; }

    .modal { max-width: 100%; padding: 14px 16px; }

    .waterfall { padding: 12px; }
    .waterfall-label { width: 84px; font-size: 11px; }
    .waterfall-value { width: 66px; font-size: 11px; }
  }

  @media (max-width: 380px) {
    .day { min-height: 40px; }
    .day-value { font-size: 9px; }
    .day-orders { display: none; }
    .waterfall-label { width: 68px; font-size: 10px; }
    .waterfall-value { width: 58px; font-size: 10px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="header-left">
      <h1>P&L Dashboard</h1>
    </div>
    <div class="header-right">
      <button class="theme-toggle" id="themeToggle" title="Toggle theme">&#9789;</button>
    </div>
  </header>

  <div class="view-switcher" id="viewSwitcher">
    <button class="view-tab active" data-view="calendar">Calendar</button>
    <button class="view-tab" data-view="ebitda">EBITDA</button>
    <button class="view-tab" data-view="annual">Annual</button>
  </div>

  <!-- CALENDAR VIEW -->
  <div class="view active" id="view-calendar">
    <div class="tabs" id="tabs" style="margin-bottom:16px;"></div>

    <div class="summary-bar" id="summary"></div>

    <div class="month-nav">
      <button id="prevMonth">&#8249;</button>
      <div class="month-label" id="monthLabel"></div>
      <button id="nextMonth">&#8250;</button>
    </div>

    <div class="calendar">
      <div class="weekdays">
        <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
      </div>
      <div class="grid" id="grid"></div>
    </div>

    <div class="range-panel">
      <div class="range-panel-title">Custom Date Range</div>
      <div class="range-controls">
        <label for="rangeStart">From</label>
        <input type="date" id="rangeStart">
        <label for="rangeEnd">To</label>
        <input type="date" id="rangeEnd">
        <button id="rangeApply">Apply</button>
      </div>
      <div class="range-summary" id="rangeSummary"></div>
    </div>
  </div>

  <!-- EBITDA VIEW -->
  <div class="view" id="view-ebitda">
    <div class="tabs" id="tabsEbitda" style="margin-bottom:16px;"></div>

    <div class="month-nav">
      <button id="prevMonthEbitda">&#8249;</button>
      <div class="month-label" id="monthLabelEbitda"></div>
      <button id="nextMonthEbitda">&#8250;</button>
    </div>

    <div class="waterfall" id="waterfall"></div>
  </div>

  <!-- ANNUAL VIEW -->
  <div class="view" id="view-annual">
    <div class="tabs" id="tabsAnnual" style="margin-bottom:16px;"></div>

    <div class="annual-table-wrap">
      <table class="annual-table" id="annualTable"></table>
    </div>
  </div>

  <footer>Updated automatically once a day from Juicy P&amp;L data</footer>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-date" id="modalDate"></div>
      <button class="modal-close" id="modalClose">&times;</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<script>
let allData = {};
let currentTab = "Blended";
let currentMonth = new Date().getMonth();
let currentYear = new Date().getFullYear();
let currentView = "calendar";

// ---- Theme ----
function initTheme() {
  const saved = localStorage.getItem("pnl-theme");
  const theme = saved || "dark";
  document.documentElement.setAttribute("data-theme", theme);
  updateThemeToggleIcon(theme);
}

function updateThemeToggleIcon(theme) {
  document.getElementById("themeToggle").textContent = theme === "dark" ? "\u2600" : "\u263D";
}

document.getElementById("themeToggle").onclick = () => {
  const current = document.documentElement.getAttribute("data-theme");
  const next = current === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("pnl-theme", next); } catch (e) {}
  updateThemeToggleIcon(next);
};

// ---- View switcher ----
document.querySelectorAll(".view-tab").forEach(btn => {
  btn.onclick = () => {
    currentView = btn.dataset.view;
    document.querySelectorAll(".view-tab").forEach(b => b.classList.toggle("active", b === btn));
    document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
    document.getElementById("view-" + currentView).classList.add("active");
    render();
  };
});

// ---- Formatting ----
function formatMoney(n) {
  const sign = n < 0 ? "-" : "";
  const abs = Math.abs(n);
  if (abs >= 1000) return sign + "$" + (abs / 1000).toFixed(2) + "K";
  return sign + "$" + abs.toFixed(2);
}

function formatMoneyFull(n) {
  const sign = n < 0 ? "-" : "";
  return sign + "$" + Math.abs(n).toFixed(2);
}

// ---- Tabs (brand filters) — shared across all three views ----
function buildTabsInto(elId) {
  const tabsEl = document.getElementById(elId);
  tabsEl.innerHTML = "";
  const names = Object.keys(allData);
  names.sort((a, b) => (a === "Blended" ? -1 : b === "Blended" ? 1 : 0));
  names.forEach(name => {
    const btn = document.createElement("button");
    btn.className = "tab" + (name === currentTab ? " active" : "");
    btn.textContent = name;
    btn.onclick = () => { currentTab = name; render(); };
    tabsEl.appendChild(btn);
  });
}

function getDataByDate() {
  const rows = allData[currentTab] || [];
  const map = {};
  rows.forEach(r => { map[r.Date] = r; });
  return map;
}

// ---- Calendar view ----
function renderSummary(dateMap) {
  const monthPrefix = `${currentYear}-${String(currentMonth + 1).padStart(2, "0")}`;
  const monthRows = Object.values(dateMap).filter(r => r.Date.startsWith(monthPrefix));
  renderStatsInto("summary", monthRows, "Net Profit (Month)");
}

function renderStatsInto(elId, rows, profitLabel) {
  const totalProfit = rows.reduce((sum, r) => sum + (r.netProfitV2 || 0), 0);
  const totalRevenue = rows.reduce((sum, r) => sum + (r.netRevenueV2 || 0), 0);
  const totalOrders = rows.reduce((sum, r) => sum + (r.ordersFloat || 0), 0);
  const winDays = rows.filter(r => (r.netProfitV2 || 0) > 0).length;

  const el = document.getElementById(elId);
  el.innerHTML = `
    <div class="stat">
      <div class="stat-label">${profitLabel}</div>
      <div class="stat-value ${totalProfit >= 0 ? "pos" : "neg"}">${formatMoney(totalProfit)}</div>
    </div>
    <div class="stat">
      <div class="stat-label">Net Revenue</div>
      <div class="stat-value">${formatMoney(totalRevenue)}</div>
    </div>
    <div class="stat">
      <div class="stat-label">Orders</div>
      <div class="stat-value">${totalOrders}</div>
    </div>
    <div class="stat">
      <div class="stat-label">Win Days</div>
      <div class="stat-value">${winDays} / ${rows.length}</div>
    </div>
  `;
}

function renderCalendar(dateMap) {
  const monthLabel = new Date(currentYear, currentMonth, 1).toLocaleDateString("en-US", { month: "long", year: "numeric" });
  document.getElementById("monthLabel").textContent = monthLabel;

  const firstDay = new Date(currentYear, currentMonth, 1).getDay();
  const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

  const gridEl = document.getElementById("grid");
  gridEl.innerHTML = "";

  for (let i = 0; i < firstDay; i++) {
    const empty = document.createElement("div");
    empty.className = "day empty";
    gridEl.appendChild(empty);
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    const record = dateMap[dateStr];
    const cell = document.createElement("div");

    if (!record || record.netProfitV2 === undefined || record.netProfitV2 === "") {
      cell.className = "day no-data";
      cell.innerHTML = `<div class="day-num">${d}</div>`;
    } else {
      const profit = record.netProfitV2;
      cell.className = "day " + (profit >= 0 ? "pos" : "neg");
      cell.innerHTML = `
        <div class="day-num">${d}</div>
        <div>
          <div class="day-value">${formatMoney(profit)}</div>
          <div class="day-orders">${record.ordersFloat || 0} orders</div>
        </div>
      `;
      cell.onclick = () => openDayModal(dateStr, record);
    }
    gridEl.appendChild(cell);
  }
}

function openDayModal(dateStr, record) {
  const dateObj = new Date(dateStr + "T00:00:00");
  const label = dateObj.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", year: "numeric" });
  document.getElementById("modalDate").textContent = label;

  const revenue = record.netRevenueV2 || 0;
  const cogs = record.cogsV2 || 0;
  const adSpend = record.totalAdSpend || 0;
  const profit = record.netProfitV2 || 0;
  const grossProfit = record.grossProfitV2 || 0;
  const orders = record.ordersFloat || 0;

  document.getElementById("modalBody").innerHTML = `
    <div class="modal-row"><div class="modal-row-label">Net Revenue</div><div class="modal-row-value">${formatMoneyFull(revenue)}</div></div>
    <div class="modal-row"><div class="modal-row-label">COGS</div><div class="modal-row-value">${formatMoneyFull(cogs)}</div></div>
    <div class="modal-row"><div class="modal-row-label">Ad Spend</div><div class="modal-row-value">${formatMoneyFull(adSpend)}</div></div>
    <div class="modal-row"><div class="modal-row-label">Gross Profit</div><div class="modal-row-value">${formatMoneyFull(grossProfit)}</div></div>
    <div class="modal-row"><div class="modal-row-label">Net Profit</div><div class="modal-row-value ${profit >= 0 ? "pos" : "neg"}">${formatMoneyFull(profit)}</div></div>
    <div class="modal-row"><div class="modal-row-label">Orders</div><div class="modal-row-value">${orders}</div></div>
  `;

  document.getElementById("modalOverlay").classList.add("open");
}

document.getElementById("modalClose").onclick = () => {
  document.getElementById("modalOverlay").classList.remove("open");
};

document.getElementById("modalOverlay").onclick = (e) => {
  if (e.target === e.currentTarget) {
    document.getElementById("modalOverlay").classList.remove("open");
  }
};

document.getElementById("rangeApply").onclick = () => {
  const start = document.getElementById("rangeStart").value;
  const end = document.getElementById("rangeEnd").value;
  if (!start || !end) return;

  const dateMap = getDataByDate();
  const rows = Object.values(dateMap).filter(r => r.Date >= start && r.Date <= end);
  renderStatsInto("rangeSummary", rows, "Net Profit (Range)");
};

document.getElementById("prevMonth").onclick = () => {
  currentMonth--;
  if (currentMonth < 0) { currentMonth = 11; currentYear--; }
  render();
};

document.getElementById("nextMonth").onclick = () => {
  currentMonth++;
  if (currentMonth > 11) { currentMonth = 0; currentYear++; }
  render();
};

// ---- EBITDA waterfall view ----
document.getElementById("prevMonthEbitda").onclick = () => {
  currentMonth--;
  if (currentMonth < 0) { currentMonth = 11; currentYear--; }
  render();
};

document.getElementById("nextMonthEbitda").onclick = () => {
  currentMonth++;
  if (currentMonth > 11) { currentMonth = 0; currentYear++; }
  render();
};

function renderEbitda(dateMap) {
  const monthLabel = new Date(currentYear, currentMonth, 1).toLocaleDateString("en-US", { month: "long", year: "numeric" });
  document.getElementById("monthLabelEbitda").textContent = monthLabel;

  const monthPrefix = `${currentYear}-${String(currentMonth + 1).padStart(2, "0")}`;
  const rows = Object.values(dateMap).filter(r => r.Date.startsWith(monthPrefix));

  const grossSales = rows.reduce((s, r) => s + (r.grossSalesV2 || 0), 0);
  const discounts = rows.reduce((s, r) => s + (r.discountsV2 || 0), 0);
  const cogs = rows.reduce((s, r) => s + (r.cogsV2 || 0), 0);
  const fees = rows.reduce((s, r) => s + (r.transactionFees || 0), 0);
  const adSpend = rows.reduce((s, r) => s + (r.totalAdSpend || 0), 0);
  const netProfit = rows.reduce((s, r) => s + (r.netProfitV2 || 0), 0);

  const steps = [
    { label: "Gross Sales", value: grossSales, type: "revenue" },
    { label: "Discounts", value: -discounts, type: "deduction" },
    { label: "COGS", value: -cogs, type: "deduction" },
    { label: "Ad Spend", value: -adSpend, type: "deduction" },
    { label: "Trans. Fees", value: -fees, type: "deduction" },
    { label: "Net Profit", value: netProfit, type: "final" },
  ];

  const maxAbs = Math.max(...steps.map(s => Math.abs(s.value)), 1);

  const waterfallEl = document.getElementById("waterfall");
  if (rows.length === 0) {
    waterfallEl.innerHTML = `<div style="padding:20px;color:var(--text-dim);font-size:13px;">No data for this month yet.</div>`;
    return;
  }

  waterfallEl.innerHTML = steps.map(s => {
    const pct = Math.min(100, (Math.abs(s.value) / maxAbs) * 100);
    const barClass = s.type === "final" ? "final" : (s.value < 0 ? "deduction" : "revenue");
    return `
      <div class="waterfall-row">
        <div class="waterfall-label">${s.label}</div>
        <div class="waterfall-bar-track">
          <div class="waterfall-bar-fill ${barClass}" style="width:${pct}%"></div>
        </div>
        <div class="waterfall-value ${s.value < 0 ? 'neg' : 'pos'}">${formatMoney(s.value)}</div>
      </div>
    `;
  }).join("");
}

// ---- Annual summary view ----
function renderAnnual(dateMap) {
  const rowsByYear = {};
  Object.values(dateMap).forEach(r => {
    const year = r.Date.slice(0, 4);
    if (!rowsByYear[year]) rowsByYear[year] = [];
    rowsByYear[year].push(r);
  });

  const years = Object.keys(rowsByYear).sort().reverse();
  const tableEl = document.getElementById("annualTable");

  if (years.length === 0) {
    tableEl.innerHTML = `<tr><td style="padding:20px;color:var(--text-dim);">No data yet.</td></tr>`;
    return;
  }

  let html = `
    <thead>
      <tr>
        <th>Year</th>
        <th>Revenue</th>
        <th>COGS</th>
        <th>Ad Spend</th>
        <th>Net Profit</th>
        <th>Net Margin</th>
        <th>Orders</th>
      </tr>
    </thead>
    <tbody>
  `;

  years.forEach(year => {
    const rows = rowsByYear[year];
    const revenue = rows.reduce((s, r) => s + (r.netRevenueV2 || 0), 0);
    const cogs = rows.reduce((s, r) => s + (r.cogsV2 || 0), 0);
    const adSpend = rows.reduce((s, r) => s + (r.totalAdSpend || 0), 0);
    const netProfit = rows.reduce((s, r) => s + (r.netProfitV2 || 0), 0);
    const orders = rows.reduce((s, r) => s + (r.ordersFloat || 0), 0);
    const margin = revenue ? (netProfit / revenue) * 100 : 0;

    html += `
      <tr>
        <td>${year}</td>
        <td>${formatMoneyFull(revenue)}</td>
        <td>${formatMoneyFull(cogs)}</td>
        <td>${formatMoneyFull(adSpend)}</td>
        <td class="${netProfit >= 0 ? 'pos' : 'neg'}">${formatMoneyFull(netProfit)}</td>
        <td class="${margin >= 0 ? 'pos' : 'neg'}">${margin.toFixed(1)}%</td>
        <td>${orders}</td>
      </tr>
    `;
  });

  html += "</tbody>";
  tableEl.innerHTML = html;
}

// ---- Main render ----
function render() {
  buildTabsInto("tabs");
  buildTabsInto("tabsEbitda");
  buildTabsInto("tabsAnnual");

  const dateMap = getDataByDate();

  if (currentView === "calendar") {
    renderSummary(dateMap);
    renderCalendar(dateMap);
    const start = document.getElementById("rangeStart").value;
    const end = document.getElementById("rangeEnd").value;
    if (start && end) {
      const rows = Object.values(dateMap).filter(r => r.Date >= start && r.Date <= end);
      renderStatsInto("rangeSummary", rows, "Net Profit (Range)");
    } else {
      document.getElementById("rangeSummary").innerHTML = "";
    }
  } else if (currentView === "ebitda") {
    renderEbitda(dateMap);
  } else if (currentView === "annual") {
    renderAnnual(dateMap);
  }
}

// ---- Load data ----
initTheme();

fetch("data.json")
  .then(res => res.json())
  .then(data => {
    allData = data;
    const blended = allData["Blended"] || [];
    if (blended.length > 0) {
      const dates = blended.map(r => r.Date).filter(Boolean).sort();
      const lastDateStr = dates[dates.length - 1];
      const [y, m] = lastDateStr.split("-").map(Number);
      currentYear = y;
      currentMonth = m - 1;
    }
    render();
  })
  .catch(err => {
    document.getElementById("grid").innerHTML = `<div style="padding:24px;color:var(--text-dim);grid-column:1/-1;">Couldn't load data.json — ${err}</div>`;
  });
</script>
</body>
</html>
