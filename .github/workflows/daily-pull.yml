name: Daily Juicy P&L Pull

on:
  schedule:
    # Runs at 5:00 AM UTC daily = midnight in Quebec (EDT, summer) / 1:00 AM Quebec (EST, winter)
    - cron: "0 5 * * *"
  workflow_dispatch: {} # allows manual triggering from the GitHub Actions tab

jobs:
  pull-and-write:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily pull
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          JUICY_TOKEN_NORDIK: ${{ secrets.JUICY_TOKEN_NORDIK }}
          JUICY_TOKEN_LYMPHEA: ${{ secrets.JUICY_TOKEN_LYMPHEA }}
          JUICY_TOKEN_SOLEA: ${{ secrets.JUICY_TOKEN_SOLEA }}
          JUICY_TOKEN_FLOREVITALE: ${{ secrets.JUICY_TOKEN_FLOREVITALE }}
          JUICY_TOKEN_AERA: ${{ secrets.JUICY_TOKEN_AERA }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python pull_juicy_data.py

      - name: Commit and push dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git diff --staged --quiet || git commit -m "Update dashboard data $(date -u +%Y-%m-%d)"
          git fetch origin main
          git merge -X ours origin/main --no-edit -m "Merge, keeping freshly-generated data.json"
          git push
