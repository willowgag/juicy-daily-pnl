<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P&L Dashboard</title>
<style>
  :root {
    --font-display: 'DM Mono', 'SF Mono', 'Consolas', monospace;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  html[data-theme="dark"] {
    --bg: #0b0d10;
    --panel: #14171b;
    --panel-raised: #1a1e23;
    --panel-border: #262b32;
    --text: #e8eaed;
    --text-dim: #8b929c;
    --green-bg: #10221a;
    --green-text: #4ade80;
    --red-bg: #26141a;
    --red-text: #f87171;
    --neutral-bg: #17191d;
    --accent: #9b6bff;
    --accent-text: #fff;
    --modal-overlay: rgba(0,0,0,0.6);
    --nav-bg: #0e1013;
  }

  html[data-theme="light"] {
    --bg: #ece2d0;
    --panel: #fffcf6;
    --panel-raised: #ffffff;
    --panel-border: #d8c9ab;
    --text: #2a2318;
    --text-dim: #6b5f4a;
    --green-bg: #dcecd2;
    --green-text: #2f6b1f;
    --red-bg: #f4dcd0;
    --red-text: #a03a1f;
    --neutral-bg: #e3d6ba;
    --accent: #c85a12;
    --accent-text: #fff;
    --modal-overlay: rgba(30,24,12,0.4);
    --nav-bg: #f7f0e2;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    padding: 20px;
    min-height: 100vh;
    transition: background 0.2s, color 0.2s;
  }

  .wrap {
    max-width: 1100px;
    margin: 0 auto;
    transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
  }

  body.nav-open .wrap { transform: translateX(180px); }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 18px;
  }

  .header-left { display: flex; align-items: center; gap: 12px; }

  .nav-toggle {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text);
    width: 36px;
    height: 36px;
    border-radius: 9px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    flex-shrink: 0;
  }

  .nav-toggle span {
    display: block;
    width: 15px;
    height: 2px;
    background: var(--text);
    border-radius: 1px;
    transition: transform 0.2s, opacity 0.2s;
  }

  body.nav-open .nav-toggle span:nth-child(1) { transform: translateY(5px) rotate(45deg); }
  body.nav-open .nav-toggle span:nth-child(2) { opacity: 0; }
  body.nav-open .nav-toggle span:nth-child(3) { transform: translateY(-5px) rotate(-45deg); }

  h1 {
    font-family: var(--font-display);
    font-size: 19px;
    font-weight: 500;
    letter-spacing: -0.02em;
    margin: 0;
    color: var(--text);
  }

  .current-view-label {
    font-size: 12px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .header-right { display: flex; align-items: center; gap: 10px; }

  .theme-toggle {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text);
    width: 36px;
    height: 36px;
    border-radius: 9px;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .theme-toggle:hover { border-color: var(--accent); }

  .nav-panel {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    width: 190px;
    background: var(--nav-bg);
    border-right: 1px solid var(--panel-border);
    padding: 24px 14px;
    transform: translateX(-100%);
    transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    z-index: 200;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  body.nav-open .nav-panel { transform: translateX(0); }

  .nav-panel-title {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    padding: 0 10px 12px;
  }

  .nav-item {
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 600;
    text-align: left;
    padding: 10px 12px;
    border-radius: 8px;
    background: transparent;
    color: var(--text-dim);
    border: none;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }

  .nav-item:hover { background: var(--panel-border); color: var(--text); }

  .nav-item.active { background: var(--accent); color: var(--accent-text); }

  .nav-scrim {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.25);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.28s;
    z-index: 150;
  }

  body.nav-open .nav-scrim { opacity: 1; pointer-events: auto; }

  .view { display: none; }
  .view.active { display: block; }

  .brand-picker {
    position: relative;
    margin-bottom: 18px;
    width: fit-content;
  }

  .brand-picker-button {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 600;
    padding: 9px 14px;
    border-radius: 10px;
    cursor: pointer;
  }

  .brand-picker-button:hover { border-color: var(--accent); }

  .brand-picker-caret { font-size: 10px; color: var(--text-dim); transition: transform 0.15s; }

  .brand-picker.open .brand-picker-caret { transform: rotate(180deg); }

  .brand-picker-menu {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    background: var(--panel-raised);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 6px;
    min-width: 160px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.18);
    display: none;
    z-index: 50;
  }

  .brand-picker.open .brand-picker-menu { display: block; }

  .brand-picker-item {
    display: block;
    width: 100%;
    text-align: left;
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 600;
    padding: 8px 10px;
    border-radius: 7px;
    background: transparent;
    color: var(--text-dim);
    border: none;
    cursor: pointer;
  }

  .brand-picker-item:hover { background: var(--neutral-bg); color: var(--text); }

  .brand-picker-item.active { background: var(--accent); color: var(--accent-text); }

  .summary-bar {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }

  .stat {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 14px 16px;
    min-width: 0;
  }

  .stat-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    margin-bottom: 6px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .stat-value {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 500;
    overflow-wrap: break-word;
  }

  .stat-value.pos { color: var(--green-text); }
  .stat-value.neg { color: var(--red-text); }

  .month-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-bottom: 14px;
  }

  .month-nav button {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text);
    width: 32px;
    height: 32px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .month-nav button:hover { background: var(--neutral-bg); }

  .month-label {
    font-family: var(--font-display);
    font-size: 15px;
    min-width: 160px;
    text-align: center;
  }

  .calendar {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    overflow: hidden;
  }

  .weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    border-bottom: 1px solid var(--panel-border);
  }

  .weekdays div {
    padding: 10px;
    text-align: center;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
  }

  .grid { display: grid; grid-template-columns: repeat(7, 1fr); }

  .day {
    min-height: 78px;
    border-right: 1px solid var(--panel-border);
    border-bottom: 1px solid var(--panel-border);
    padding: 8px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    cursor: default;
    transition: filter 0.1s;
    min-width: 0;
    overflow: hidden;
  }

  .day:nth-child(7n) { border-right: none; }

  .day.empty { background: transparent; cursor: default; }
  .day.no-data { background: var(--neutral-bg); }
  .day.pos { background: var(--green-bg); }
  .day.neg { background: var(--red-bg); }
  .day.pos, .day.neg { cursor: pointer; }
  .day.pos:hover, .day.neg:hover { filter: brightness(0.93); }
  html[data-theme="light"] .day.pos:hover,
  html[data-theme="light"] .day.neg:hover { filter: brightness(0.96); }

  .day-num { font-size: 11px; color: var(--text-dim); }

  .day-value {
    font-family: var(--font-display);
    font-size: 14px;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .day.pos .day-value { color: var(--green-text); }
  .day.neg .day-value { color: var(--red-text); }

  .day-orders {
    font-size: 10px;
    color: var(--text-dim);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .range-panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 16px 18px;
    margin-top: 24px;
  }

  .range-panel-title {
    font-family: var(--font-display);
    font-size: 13px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 12px;
  }

  .range-controls {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }

  .range-controls label { font-size: 12px; color: var(--text-dim); }

  .range-controls input[type="date"] {
    background: var(--bg);
    border: 1px solid var(--panel-border);
    color: var(--text);
    border-radius: 7px;
    padding: 6px 10px;
    font-family: var(--font-body);
    font-size: 13px;
    min-width: 0;
  }

  .range-controls button {
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    border-radius: 7px;
    padding: 7px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }

  .range-summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: var(--modal-overlay);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 300;
    padding: 20px;
  }

  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--panel-raised);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 20px 22px;
    max-width: 340px;
    width: 100%;
  }

  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .modal-date { font-family: var(--font-display); font-size: 15px; }

  .modal-close {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 18px;
    cursor: pointer;
    line-height: 1;
    padding: 4px;
  }

  .modal-close:hover { color: var(--text); }

  .modal-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid var(--panel-border);
    font-size: 13px;
    gap: 12px;
  }

  .modal-row:last-child { border-bottom: none; }
  .modal-row-label { color: var(--text-dim); }
  .modal-row-value { font-family: var(--font-display); font-weight: 600; text-align: right; }
  .modal-row-value.pos { color: var(--green-text); }
  .modal-row-value.neg { color: var(--red-text); }

  .ebitda-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }

  .ebitda-tile {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 18px 20px;
    min-width: 0;
  }

  .ebitda-tile-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .ebitda-tile-icon { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }

  .ebitda-tile-value {
    font-family: var(--font-display);
    font-size: 26px;
    font-weight: 600;
    overflow-wrap: break-word;
  }

  .ebitda-tile-value.pos { color: var(--green-text); }
  .ebitda-tile-value.neg { color: var(--red-text); }
  .ebitda-tile-sub { font-size: 12px; color: var(--text-dim); margin-top: 6px; }

  .ebitda-tile.featured {
    grid-column: span 3;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }

  .ebitda-tile.featured .ebitda-tile-value { font-size: 34px; }

  .annual-table-wrap {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    overflow-x: auto;
  }

  table.annual-table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 560px; }

  table.annual-table th,
  table.annual-table td {
    padding: 10px 14px;
    text-align: right;
    border-bottom: 1px solid var(--panel-border);
    white-space: nowrap;
  }

  table.annual-table th:first-child,
  table.annual-table td:first-child { text-align: left; font-family: var(--font-display); }

  table.annual-table th {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-dim);
    font-weight: 600;
    background: var(--neutral-bg);
  }

  table.annual-table tr:last-child td { border-bottom: none; }

  td.pos { color: var(--green-text); }
  td.neg { color: var(--red-text); }

  footer { margin-top: 20px; text-align: center; font-size: 11px; color: var(--text-dim); }

  @media (max-width: 640px) {
    body { padding: 10px; }
    header { gap: 8px; margin-bottom: 12px; }
    h1 { font-size: 15px; }
    .current-view-label { font-size: 10px; }
    .header-right { gap: 6px; }
    .nav-toggle, .theme-toggle { width: 32px; height: 32px; }

    body.nav-open .wrap { transform: translateX(150px); }
    .nav-panel { width: 160px; padding: 20px 10px; }
    .nav-item { font-size: 13px; padding: 9px 10px; }

    .brand-picker-button { padding: 8px 12px; font-size: 13px; }

    .summary-bar, .range-summary { grid-template-columns: repeat(2, 1fr); gap: 6px; }
    .stat { padding: 9px 10px; }
    .stat-label { font-size: 10px; }
    .stat-value { font-size: 15px; }

    .month-nav { gap: 8px; margin-bottom: 8px; }
    .month-label { font-size: 12px; min-width: 100px; }

    .weekdays div { padding: 5px 1px; font-size: 8px; }

    .day { min-height: 48px; padding: 3px; }
    .day-num { font-size: 8px; }
    .day-value { font-size: 10px; }
    .day-orders { font-size: 7px; }

    .range-panel { padding: 10px; margin-top: 12px; }
    .range-controls { gap: 5px; }
    .range-controls label { font-size: 10px; }
    .range-controls input[type="date"] { padding: 5px 4px; font-size: 11px; flex: 1 1 100px; }
    .range-controls button { padding: 6px 9px; font-size: 11px; }

    .modal { max-width: 100%; padding: 14px 16px; }

    .ebitda-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .ebitda-tile { padding: 12px 14px; }
    .ebitda-tile-value { font-size: 19px; }
    .ebitda-tile.featured { grid-column: span 2; }
    .ebitda-tile.featured .ebitda-tile-value { font-size: 24px; }
  }

  @media (max-width: 380px) {
    .day { min-height: 40px; }
    .day-value { font-size: 9px; }
    .day-orders { display: none; }
  }
</style>
</head>
<body>
<div class="nav-scrim" id="navScrim"></div>
<div class="nav-panel" id="navPanel">
  <div class="nav-panel-title">Views</div>
  <button class="nav-item active" data-view="calendar">Calendar</button>
  <button class="nav-item" data-view="ebitda">EBITDA</button>
  <button class="nav-item" data-view="annual">Annual</button>
  <button class="nav-item" data-view="payouts">Payouts</button>
</div>

<div class="wrap">
  <header>
    <div class="header-left">
      <button class="nav-toggle" id="navToggle" title="Menu">
        <span></span><span></span><span></span>
      </button>
      <div>
        <h1>P&L Dashboard</h1>
        <div class="current-view-label" id="currentViewLabel">Calendar</div>
      </div>
    </div>
    <div class="header-right">
      <button class="theme-toggle" id="themeToggle" title="Toggle theme">&#9789;</button>
    </div>
  </header>

  <div class="view active" id="view-calendar">
    <div class="brand-picker" id="brandPicker-calendar">
      <button class="brand-picker-button" data-menu="calendar">
        <span data-label>Blended</span>
        <span class="brand-picker-caret">&#9662;</span>
      </button>
      <div class="brand-picker-menu" id="brandMenu-calendar"></div>
    </div>

    <div class="summary-bar" id="summary"></div>

    <div class="month-nav">
      <button id="prevMonth">&#8249;</button>
      <div class="month-label" id="monthLabel"></div>
      <button id="nextMonth">&#8250;</button>
    </div>

    <div class="calendar">
      <div class="weekdays">
        <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
      </div>
      <div class="grid" id="grid"></div>
    </div>

    <div class="range-panel">
      <div class="range-panel-title">Custom Date Range</div>
      <div class="range-controls">
        <label for="rangeStart">From</label>
        <input type="date" id="rangeStart">
        <label for="rangeEnd">To</label>
        <input type="date" id="rangeEnd">
        <button id="rangeApply">Apply</button>
      </div>
      <div class="range-summary" id="rangeSummary"></div>
    </div>
  </div>

  <div class="view" id="view-ebitda">
    <div class="brand-picker" id="brandPicker-ebitda">
      <button class="brand-picker-button" data-menu="ebitda">
        <span data-label>Blended</span>
        <span class="brand-picker-caret">&#9662;</span>
      </button>
      <div class="brand-picker-menu" id="brandMenu-ebitda"></div>
    </div>

    <div class="month-nav">
      <button id="prevMonthEbitda">&#8249;</button>
      <div class="month-label" id="monthLabelEbitda"></div>
      <button id="nextMonthEbitda">&#8250;</button>
    </div>

    <div class="ebitda-grid" id="waterfall"></div>
  </div>

  <div class="view" id="view-annual">
    <div class="brand-picker" id="brandPicker-annual">
      <button class="brand-picker-button" data-menu="annual">
        <span data-label>Blended</span>
        <span class="brand-picker-caret">&#9662;</span>
      </button>
      <div class="brand-picker-menu" id="brandMenu-annual"></div>
    </div>

    <div class="annual-table-wrap">
      <table class="annual-table" id="annualTable"></table>
    </div>
  </div>

  <div class="view" id="view-payouts">
    <div class="brand-picker" id="brandPicker-payouts">
      <button class="brand-picker-button" data-menu="payouts">
        <span data-label>Blended</span>
        <span class="brand-picker-caret">&#9662;</span>
      </button>
      <div class="brand-picker-menu" id="brandMenu-payouts"></div>
    </div>

    <div class="summary-bar" id="payoutsSummary"></div>

    <div class="range-panel-title" style="margin-top:24px;">Payout History</div>
    <div class="annual-table-wrap" style="margin-top:12px;">
      <table class="annual-table" id="payoutsHistoryTable"></table>
    </div>
  </div>

  <footer>Updated automatically once a day from Juicy P&amp;L data</footer>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-date" id="modalDate"></div>
      <button class="modal-close" id="modalClose">&times;</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<script>
let allData = {};
let currentTab = "Blended";
let currentPayoutsTab = "Blended";
let currentMonth = new Date().getMonth();
let currentYear = new Date().getFullYear();
let currentView = "calendar";

const VIEW_LABELS = { calendar: "Calendar", ebitda: "EBITDA", annual: "Annual", payouts: "Payouts" };

function initTheme() {
  const saved = localStorage.getItem("pnl-theme");
  const theme = saved || "dark";
  document.documentElement.setAttribute("data-theme", theme);
  updateThemeToggleIcon(theme);
}

function updateThemeToggleIcon(theme) {
  document.getElementById("themeToggle").textContent = theme === "dark" ? "\u2600" : "\u263D";
}

document.getElementById("themeToggle").onclick = () => {
  const current = document.documentElement.getAttribute("data-theme");
  const next = current === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("pnl-theme", next); } catch (e) {}
  updateThemeToggleIcon(next);
};

const navToggle = document.getElementById("navToggle");
const navScrim = document.getElementById("navScrim");

function closeNav() { document.body.classList.remove("nav-open"); }
function toggleNav() { document.body.classList.toggle("nav-open"); }

navToggle.onclick = toggleNav;
navScrim.onclick = closeNav;

document.querySelectorAll(".nav-item").forEach(btn => {
  btn.onclick = () => {
    currentView = btn.dataset.view;
    document.querySelectorAll(".nav-item").forEach(b => b.classList.toggle("active", b === btn));
    document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
    document.getElementById("view-" + currentView).classList.add("active");
    document.getElementById("currentViewLabel").textContent = VIEW_LABELS[currentView];
    closeNav();
    render();
  };
});

function formatMoney(n) {
  const sign = n < 0 ? "-" : "";
  const abs = Math.abs(n);
  if (abs >= 1000) return sign + "$" + (abs / 1000).toFixed(2) + "K";
  return sign + "$" + abs.toFixed(2);
}

function formatMoneyFull(n) {
  const sign = n < 0 ? "-" : "";
  return sign + "$" + Math.abs(n).toFixed(2);
}

function getPnlBrandNames() {
  const names = Object.keys(allData).filter(k => k !== "Payouts");
  names.sort((a, b) => (a === "Blended" ? -1 : b === "Blended" ? 1 : 0));
  return names;
}

function getPayoutsBrandNames() {
  const payoutsData = allData["Payouts"] || {};
  const names = Object.keys(payoutsData);
  names.sort((a, b) => (a === "Blended" ? -1 : b === "Blended" ? 1 : 0));
  return names;
}

function buildBrandPicker(viewKey, names, currentValue, onSelect) {
  const pickerEl = document.getElementById("brandPicker-" + viewKey);
  const buttonEl = pickerEl.querySelector(".brand-picker-button");
  const labelEl = buttonEl.querySelector("[data-label]");
  const menuEl = document.getElementById("brandMenu-" + viewKey);

  labelEl.textContent = currentValue;
  menuEl.innerHTML = "";

  names.forEach(name => {
    const item = document.createElement("button");
    item.className = "brand-picker-item" + (name === currentValue ? " active" : "");
    item.textContent = name;
    item.onclick = () => {
      onSelect(name);
      pickerEl.classList.remove("open");
    };
    menuEl.appendChild(item);
  });

  buttonEl.onclick = (e) => {
    e.stopPropagation();
    document.querySelectorAll(".brand-picker").forEach(p => {
      if (p !== pickerEl) p.classList.remove("open");
    });
    pickerEl.classList.toggle("open");
  };
}

document.addEventListener("click", () => {
  document.querySelectorAll(".brand-picker").forEach(p => p.classList.remove("open"));
});

function getDataByDate() {
  const rows = allData[currentTab] || [];
  const map = {};
  rows.forEach(r => { map[r.Date] = r; });
  return map;
}

function renderSummary(dateMap) {
  const monthPrefix = `${currentYear}-${String(currentMonth + 1).padStart(2, "0")}`;
  const monthRows = Object.values(dateMap).filter(r => r.Date.startsWith(monthPrefix));
  renderStatsInto("summary", monthRows, "Net Profit (Month)");
}

function renderStatsInto(elId, rows, profitLabel) {
  const totalProfit = rows.reduce((sum, r) => sum + (r.netProfitV2 || 0), 0);
  const totalRevenue = rows.reduce((sum, r) => sum + (r.netRevenueV2 || 0), 0);
  const totalOrders = rows.reduce((sum, r) => sum + (r.ordersFloat || 0), 0);
  const winDays = rows.filter(r => (r.netProfitV2 || 0) > 0).length;

  const el = document.getElementById(elId);
  el.innerHTML = `
    <div class="stat">
      <div class="stat-label">${profitLabel}</div>
      <div class="stat-value ${totalProfit >= 0 ? "pos" : "neg"}">${formatMoney(totalProfit)}</div>
    </div>
    <div class="stat">
      <div class="stat-label">Net Revenue</div>
      <div class="stat-value">${formatMoney(totalRevenue)}</div>
    </div>
    <div class="stat">
      <div class="stat-label">Orders</div>
      <div class="stat-value">${totalOrders}</div>
    </div>
    <div class="stat">
      <div class="stat-label">Win Days</div>
      <div class="stat-value">${winDays} / ${rows.length}</div>
    </div>
  `;
}

function renderCalendar(dateMap) {
  const monthLabel = new Date(currentYear, currentMonth, 1).toLocaleDateString("en-US", { month: "long", year: "numeric" });
  document.getElementById("monthLabel").textContent = monthLabel;

  const firstDay = new Date(currentYear, currentMonth, 1).getDay();
  const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

  const gridEl = document.getElementById("grid");
  gridEl.innerHTML = "";

  for (let i = 0; i < firstDay; i++) {
    const empty = document.createElement("div");
    empty.className = "day empty";
    gridEl.appendChild(empty);
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    const record = dateMap[dateStr];
    const cell = document.createElement("div");

    if (!record || record.netProfitV2 === undefined || record.netProfitV2 === "") {
      cell.className = "day no-data";
      cell.innerHTML = `<div class="day-num">${d}</div>`;
    } else {
      const profit = record.netProfitV2;
      cell.className = "day " + (profit >= 0 ? "pos" : "neg");
      cell.innerHTML = `
        <div class="day-num">${d}</div>
        <div>
          <div class="day-value">${formatMoney(profit)}</div>
          <div class="day-orders">${record.ordersFloat || 0} orders</div>
        </div>
      `;
      cell.onclick = () => openDayModal(dateStr, record);
    }
    gridEl.appendChild(cell);
  }
}

function openDayModal(dateStr, record) {
  const dateObj = new Date(dateStr + "T00:00:00");
  const label = dateObj.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", year: "numeric" });
  document.getElementById("modalDate").textContent = label;

  const revenue = record.netRevenueV2 || 0;
  const cogs = record.cogsV2 || 0;
  const adSpend = record.totalAdSpend || 0;
  const profit = record.netProfitV2 || 0;
  const grossProfit = record.grossProfitV2 || 0;
  const orders = record.ordersFloat || 0;

  document.getElementById("modalBody").innerHTML = `
    <div class="modal-row"><div class="modal-row-label">Net Revenue</div><div class="modal-row-value">${formatMoneyFull(revenue)}</div></div>
    <div class="modal-row"><div class="modal-row-label">COGS</div><div class="modal-row-value">${formatMoneyFull(cogs)}</div></div>
    <div class="modal-row"><div class="modal-row-label">Ad Spend</div><div class="modal-row-value">${formatMoneyFull(adSpend)}</div></div>
    <div class="modal-row"><div class="modal-row-label">Gross Profit</div><div class="modal-row-value">${formatMoneyFull(grossProfit)}</div></div>
    <div class="modal-row"><div class="modal-row-label">Net Profit</div><div class="modal-row-value ${profit >= 0 ? "pos" : "neg"}">${formatMoneyFull(profit)}</div></div>
    <div class="modal-row"><div class="modal-row-label">Orders</div><div class="modal-row-value">${orders}</div></div>
  `;

  document.getElementById("modalOverlay").classList.add("open");
}

document.getElementById("modalClose").onclick = () => {
  document.getElementById("modalOverlay").classList.remove("open");
};

document.getElementById("modalOverlay").onclick = (e) => {
  if (e.target === e.currentTarget) {
    document.getElementById("modalOverlay").classList.remove("open");
  }
};

document.getElementById("rangeApply").onclick = () => {
  const start = document.getElementById("rangeStart").value;
  const end = document.getElementById("rangeEnd").value;
  if (!start || !end) return;

  const dateMap = getDataByDate();
  const rows = Object.values(dateMap).filter(r => r.Date >= start && r.Date <= end);
  renderStatsInto("rangeSummary", rows, "Net Profit (Range)");
};

document.getElementById("prevMonth").onclick = () => {
  currentMonth--;
  if (currentMonth < 0) { currentMonth = 11; currentYear--; }
  render();
};

document.getElementById("nextMonth").onclick = () => {
  currentMonth++;
  if (currentMonth > 11) { currentMonth = 0; currentYear++; }
  render();
};

document.getElementById("prevMonthEbitda").onclick = () => {
  currentMonth--;
  if (currentMonth < 0) { currentMonth = 11; currentYear--; }
  render();
};

document.getElementById("nextMonthEbitda").onclick = () => {
  currentMonth++;
  if (currentMonth > 11) { currentMonth = 0; currentYear++; }
  render();
};

function renderEbitda(dateMap) {
  const monthLabel = new Date(currentYear, currentMonth, 1).toLocaleDateString("en-US", { month: "long", year: "numeric" });
  document.getElementById("monthLabelEbitda").textContent = monthLabel;

  const monthPrefix = `${currentYear}-${String(currentMonth + 1).padStart(2, "0")}`;
  const rows = Object.values(dateMap).filter(r => r.Date.startsWith(monthPrefix));

  const gridEl = document.getElementById("waterfall");
  if (rows.length === 0) {
    gridEl.innerHTML = `<div style="padding:20px;color:var(--text-dim);font-size:13px;grid-column:1/-1;">No data for this month yet.</div>`;
    return;
  }

  const revenue = rows.reduce((s, r) => s + (r.netRevenueV2 || 0), 0);
  const cogs = rows.reduce((s, r) => s + (r.cogsV2 || 0), 0);
  const adSpend = rows.reduce((s, r) => s + (r.totalAdSpend || 0), 0);
  const grossProfit = rows.reduce((s, r) => s + (r.grossProfitV2 || 0), 0);
  const netProfit = rows.reduce((s, r) => s + (r.netProfitV2 || 0), 0);
  const orders = rows.reduce((s, r) => s + (r.ordersFloat || 0), 0);

  const margin = revenue ? (netProfit / revenue) * 100 : 0;
  const cogsPct = revenue ? (cogs / revenue) * 100 : 0;
  const adSpendPct = revenue ? (adSpend / revenue) * 100 : 0;
  const aov = orders ? revenue / orders : 0;

  const tiles = [
    { label: "Net Profit", value: formatMoneyFull(netProfit), sub: `${margin.toFixed(1)}% margin`, colorClass: netProfit >= 0 ? "pos" : "neg", dotColor: "var(--green-text)", featured: true },
    { label: "Revenue", value: formatMoneyFull(revenue), sub: `${orders} orders`, colorClass: "", dotColor: "var(--accent)" },
    { label: "COGS", value: formatMoneyFull(cogs), sub: `${cogsPct.toFixed(1)}% of revenue`, colorClass: "", dotColor: "var(--red-text)" },
    { label: "Ad Spend", value: formatMoneyFull(adSpend), sub: `${adSpendPct.toFixed(1)}% of revenue`, colorClass: "", dotColor: "var(--red-text)" },
    { label: "Gross Profit", value: formatMoneyFull(grossProfit), sub: revenue ? `${((grossProfit / revenue) * 100).toFixed(1)}% margin` : "", colorClass: grossProfit >= 0 ? "pos" : "neg", dotColor: "var(--green-text)" },
    { label: "AOV", value: formatMoneyFull(aov), sub: "avg order value", colorClass: "", dotColor: "var(--accent)" },
  ];

  gridEl.innerHTML = tiles.map(t => `
    <div class="ebitda-tile${t.featured ? ' featured' : ''}">
      <div>
        <div class="ebitda-tile-label"><span class="ebitda-tile-icon" style="background:${t.dotColor}"></span>${t.label}</div>
        <div class="ebitda-tile-value ${t.colorClass}">${t.value}</div>
      </div>
      <div class="ebitda-tile-sub">${t.sub}</div>
    </div>
  `).join("");
}

function renderAnnual(dateMap) {
  const rowsByYear = {};
  Object.values(dateMap).forEach(r => {
    const year = r.Date.slice(0, 4);
    if (!rowsByYear[year]) rowsByYear[year] = [];
    rowsByYear[year].push(r);
  });

  const years = Object.keys(rowsByYear).sort().reverse();
  const tableEl = document.getElementById("annualTable");

  if (years.length === 0) {
    tableEl.innerHTML = `<tr><td style="padding:20px;color:var(--text-dim);">No data yet.</td></tr>`;
    return;
  }

  let html = `
    <thead>
      <tr>
        <th>Year</th>
        <th>Revenue</th>
        <th>COGS</th>
        <th>Ad Spend</th>
        <th>Net Profit</th>
        <th>Net Margin</th>
        <th>Orders</th>
      </tr>
    </thead>
    <tbody>
  `;

  years.forEach(year => {
    const rows = rowsByYear[year];
    const revenue = rows.reduce((s, r) => s + (r.netRevenueV2 || 0), 0);
    const cogs = rows.reduce((s, r) => s + (r.cogsV2 || 0), 0);
    const adSpend = rows.reduce((s, r) => s + (r.totalAdSpend || 0), 0);
    const netProfit = rows.reduce((s, r) => s + (r.netProfitV2 || 0), 0);
    const orders = rows.reduce((s, r) => s + (r.ordersFloat || 0), 0);
    const margin = revenue ? (netProfit / revenue) * 100 : 0;

    html += `
      <tr>
        <td>${year}</td>
        <td>${formatMoneyFull(revenue)}</td>
        <td>${formatMoneyFull(cogs)}</td>
        <td>${formatMoneyFull(adSpend)}</td>
        <td class="${netProfit >= 0 ? 'pos' : 'neg'}">${formatMoneyFull(netProfit)}</td>
        <td class="${margin >= 0 ? 'pos' : 'neg'}">${margin.toFixed(1)}%</td>
        <td>${orders}</td>
      </tr>
    `;
  });

  html += "</tbody>";
  tableEl.innerHTML = html;
}

function renderPayouts() {
  const payoutsData = allData["Payouts"] || {};
  const record = payoutsData[currentPayoutsTab];
  const el = document.getElementById("payoutsSummary");

  if (!record) {
    el.innerHTML = `<div style="padding:20px;color:var(--text-dim);grid-column:1/-1;">No payout data yet for ${currentPayoutsTab}.</div>`;
    document.getElementById("payoutsHistoryTable").innerHTML = "";
    return;
  }

  const balance = record.Balance || 0;
  const nextAmount = record.NextPayoutAmount || 0;
  const nextDate = record.NextPayoutDate || "";
  const nextDateLabel = nextDate
    ? new Date(nextDate + "T00:00:00").toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" })
    : "None scheduled";

  el.innerHTML = `
    <div class="stat">
      <div class="stat-label">Available Balance</div>
      <div class="stat-value pos">${formatMoneyFull(balance)}</div>
    </div>
    <div class="stat">
      <div class="stat-label">Next Payout Amount</div>
      <div class="stat-value">${nextAmount ? formatMoneyFull(nextAmount) : "—"}</div>
    </div>
    <div class="stat">
      <div class="stat-label">Next Payout Date</div>
      <div class="stat-value" style="font-size:16px;">${nextDateLabel}</div>
    </div>
    <div class="stat">
      <div class="stat-label">Last Updated</div>
      <div class="stat-value" style="font-size:16px;">${record.Date || "—"}</div>
    </div>
  `;

  renderPayoutsHistory(record.History || []);
}

function renderPayoutsHistory(history) {
  const tableEl = document.getElementById("payoutsHistoryTable");

  if (!history.length) {
    tableEl.innerHTML = `<tr><td style="padding:20px;color:var(--text-dim);">No history yet.</td></tr>`;
    return;
  }

  const sorted = [...history].sort((a, b) => (a.Date < b.Date ? 1 : -1));

  let html = `
    <thead>
      <tr>
        <th>Date</th>
        <th>Balance</th>
        <th>Next Payout Date</th>
        <th>Next Payout Amount</th>
      </tr>
    </thead>
    <tbody>
  `;

  sorted.forEach(r => {
    const nextDate = r.NextPayoutDate
      ? new Date(r.NextPayoutDate + "T00:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric" })
      : "—";
    const nextAmt = r.NextPayoutAmount ? formatMoneyFull(r.NextPayoutAmount) : "—";
    html += `
      <tr>
        <td>${r.Date}</td>
        <td>${formatMoneyFull(r.Balance || 0)}</td>
        <td>${nextDate}</td>
        <td>${nextAmt}</td>
      </tr>
    `;
  });

  html += "</tbody>";
  tableEl.innerHTML = html;
}

function render() {
  const pnlBrands = getPnlBrandNames();
  buildBrandPicker("calendar", pnlBrands, currentTab, (name) => { currentTab = name; render(); });
  buildBrandPicker("ebitda", pnlBrands, currentTab, (name) => { currentTab = name; render(); });
  buildBrandPicker("annual", pnlBrands, currentTab, (name) => { currentTab = name; render(); });

  const payoutsBrands = getPayoutsBrandNames();
  buildBrandPicker("payouts", payoutsBrands, currentPayoutsTab, (name) => { currentPayoutsTab = name; render(); });

  const dateMap = getDataByDate();

  if (currentView === "calendar") {
    renderSummary(dateMap);
    renderCalendar(dateMap);
    const start = document.getElementById("rangeStart").value;
    const end = document.getElementById("rangeEnd").value;
    if (start && end) {
      const rows = Object.values(dateMap).filter(r => r.Date >= start && r.Date <= end);
      renderStatsInto("rangeSummary", rows, "Net Profit (Range)");
    } else {
      document.getElementById("rangeSummary").innerHTML = "";
    }
  } else if (currentView === "ebitda") {
    renderEbitda(dateMap);
  } else if (currentView === "annual") {
    renderAnnual(dateMap);
  } else if (currentView === "payouts") {
    renderPayouts();
  }
}

initTheme();

fetch("data.json")
  .then(res => res.json())
  .then(data => {
    allData = data;
    const blended = allData["Blended"] || [];
    if (blended.length > 0) {
      const dates = blended.map(r => r.Date).filter(Boolean).sort();
      const lastDateStr = dates[dates.length - 1];
      const [y, m] = lastDateStr.split("-").map(Number);
      currentYear = y;
      currentMonth = m - 1;
    }
    render();
  })
  .catch(err => {
    document.getElementById("grid").innerHTML = `<div style="padding:24px;color:var(--text-dim);grid-column:1/-1;">Couldn't load data.json — ${err}</div>`;
  });
</script>
</body>
</html>
