<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P/L Gazou</title>
<style>
  :root {
    --font-display: 'DM Mono', 'SF Mono', 'Consolas', monospace;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  /* Dark theme (default) — purple accent */
  html[data-theme="dark"] {
    --bg: #0b0d10;
    --panel: #14171b;
    --panel-border: #23272d;
    --text: #e8eaed;
    --text-dim: #8b929c;
    --green-bg: #10221a;
    --green-text: #4ade80;
    --red-bg: #26141a;
    --red-text: #f87171;
    --neutral-bg: #17191d;
    --accent: #9b6bff;
    --accent-text: #fff;
    --modal-overlay: rgba(0,0,0,0.6);
  }

  /* Light theme — cyan accent */
  html[data-theme="light"] {
    --bg: #f5f7f9;
    --panel: #ffffff;
    --panel-border: #e2e6ea;
    --text: #1a1d21;
    --text-dim: #6b7280;
    --green-bg: #e7f9ef;
    --green-text: #16a34a;
    --red-bg: #fdecec;
    --red-text: #dc2626;
    --neutral-bg: #f1f3f5;
    --accent: #06b6d4;
    --accent-text: #fff;
    --modal-overlay: rgba(0,0,0,0.35);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    padding: 24px;
    min-height: 100vh;
    transition: background 0.2s, color 0.2s;
  }

  .wrap {
    max-width: 1100px;
    margin: 0 auto;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 20px;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  h1 {
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 500;
    letter-spacing: -0.02em;
    margin: 0;
    color: var(--text);
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .theme-toggle {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text);
    width: 34px;
    height: 34px;
    border-radius: 9px;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .theme-toggle:hover { border-color: var(--accent); }

  .tabs {
    display: flex;
    gap: 4px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 4px;
  }

  .tab {
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 600;
    padding: 7px 14px;
    border-radius: 7px;
    background: transparent;
    color: var(--text-dim);
    border: none;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }

  .tab:hover { color: var(--text); }

  .tab.active {
    background: var(--accent);
    color: var(--accent-text);
  }

  .summary-bar {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }

  .stat {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 14px 16px;
  }

  .stat-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    margin-bottom: 6px;
  }

  .stat-value {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 500;
  }

  .stat-value.pos { color: var(--green-text); }
  .stat-value.neg { color: var(--red-text); }

  .month-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-bottom: 14px;
  }

  .month-nav button {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text);
    width: 32px;
    height: 32px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .month-nav button:hover { background: var(--neutral-bg); }

  .month-label {
    font-family: var(--font-display);
    font-size: 15px;
    min-width: 160px;
    text-align: center;
  }

  .calendar {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    overflow: hidden;
  }

  .weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    border-bottom: 1px solid var(--panel-border);
  }

  .weekdays div {
    padding: 10px;
    text-align: center;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
  }

  .day {
    min-height: 78px;
    border-right: 1px solid var(--panel-border);
    border-bottom: 1px solid var(--panel-border);
    padding: 8px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    cursor: default;
    transition: filter 0.1s;
  }

  .day:nth-child(7n) { border-right: none; }

  .day.empty { background: transparent; cursor: default; }
  .day.no-data { background: var(--neutral-bg); }

  .day.pos { background: var(--green-bg); }
  .day.neg { background: var(--red-bg); }

  .day.pos, .day.neg { cursor: pointer; }
  .day.pos:hover, .day.neg:hover { filter: brightness(0.93); }
  html[data-theme="light"] .day.pos:hover,
  html[data-theme="light"] .day.neg:hover { filter: brightness(0.97); }

  .day-num {
    font-size: 11px;
    color: var(--text-dim);
  }

  .day-value {
    font-family: var(--font-display);
    font-size: 14px;
    font-weight: 600;
  }

  .day.pos .day-value { color: var(--green-text); }
  .day.neg .day-value { color: var(--red-text); }

  .day-orders {
    font-size: 10px;
    color: var(--text-dim);
  }

  .range-panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 16px 18px;
    margin-top: 24px;
  }

  .range-panel-title {
    font-family: var(--font-display);
    font-size: 13px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 12px;
  }

  .range-controls {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }

  .range-controls label {
    font-size: 12px;
    color: var(--text-dim);
  }

  .range-controls input[type="date"] {
    background: var(--bg);
    border: 1px solid var(--panel-border);
    color: var(--text);
    border-radius: 7px;
    padding: 6px 10px;
    font-family: var(--font-body);
    font-size: 13px;
  }

  .range-controls button {
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    border-radius: 7px;
    padding: 7px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }

  .range-summary {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: var(--modal-overlay);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }

  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 20px 22px;
    max-width: 340px;
    width: 100%;
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }

  .modal-date {
    font-family: var(--font-display);
    font-size: 15px;
  }

  .modal-close {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 18px;
    cursor: pointer;
    line-height: 1;
    padding: 4px;
  }

  .modal-close:hover { color: var(--text); }

  .modal-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid var(--panel-border);
    font-size: 13px;
  }

  .modal-row:last-child { border-bottom: none; }

  .modal-row-label { color: var(--text-dim); }
  .modal-row-value { font-family: var(--font-display); font-weight: 600; }
  .modal-row-value.pos { color: var(--green-text); }
  .modal-row-value.neg { color: var(--red-text); }

  footer {
    margin-top: 20px;
    text-align: center;
    font-size: 11px;
    color: var(--text-dim);
  }

  @media (max-width: 640px) {
    .summary-bar, .range-summary { grid-template-columns: repeat(2, 1fr); }
    .day { min-height: 60px; padding: 6px; }
    .day-value { font-size: 12px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="header-left">
      <h1>P&L Calendar</h1>
    </div>
    <div class="header-right">
      <div class="tabs" id="tabs"></div>
      <button class="theme-toggle" id="themeToggle" title="Toggle theme">&#9789;</button>
    </div>
  </header>

  <div class="summary-bar" id="summary"></div>

  <div class="month-nav">
    <button id="prevMonth">&#8249;</button>
    <div class="month-label" id="monthLabel"></div>
    <button id="nextMonth">&#8250;</button>
  </div>

  <div class="calendar">
    <div class="weekdays">
      <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <div class="range-panel">
    <div class="range-panel-title">Custom Date Range</div>
    <div class="range-controls">
      <label for="rangeStart">From</label>
      <input type="date" id="rangeStart">
      <label for="rangeEnd">To</label>
      <input type="date" id="rangeEnd">
      <button id="rangeApply">Apply</button>
    </div>
    <div class="range-summary" id="rangeSummary"></div>
  </div>

  <footer>Updated automatically once a day from Juicy P&amp;L data</footer>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-date" id="modalDate"></div>
      <button class="modal-close" id="modalClose">&times;</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<script>
let allData = {};
let currentTab = "Blended";
let currentMonth = new Date().getMonth();
let currentYear = new Date().getFullYear();

function initTheme() {
  const saved = localStorage.getItem("pnl-theme");
  const theme = saved || "dark";
  document.documentElement.setAttribute("data-theme", theme);
  updateThemeToggleIcon(theme);
}

function updateThemeToggleIcon(theme) {
  document.getElementById("themeToggle").textContent = theme === "dark" ? "\u2600" : "\u263D";
}

document.getElementById("themeToggle").onclick = () => {
  const current = document.documentElement.getAttribute("data-theme");
  const next = current === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("pnl-theme", next); } catch (e) {}
  updateThemeToggleIcon(next);
};

function formatMoney(n) {
  const sign = n < 0 ? "-" : "";
  const abs = Math.abs(n);
  if (abs >= 1000) return sign + "$" + (abs / 1000).toFixed(2) + "K";
  return sign + "$" + abs.toFixed(2);
}

function formatMoneyFull(n) {
  const sign = n < 0 ? "-" : "";
  return sign + "$" + Math.abs(n).toFixed(2);
}

function buildTabs() {
  const tabsEl = document.getElementById("tabs");
  tabsEl.innerHTML = "";
  const names = Object.keys(allData);
  names.sort((a, b) => (a === "Blended" ? -1 : b === "Blended" ? 1 : 0));
  names.forEach(name => {
    const btn = document.createElement("button");
    btn.className = "tab" + (name === currentTab ? " active" : "");
    btn.textContent = name;
    btn.onclick = () => { currentTab = name; render(); };
    tabsEl.appendChild(btn);
  });
}

function getDataByDate() {
  const rows = allData[currentTab] || [];
  const map = {};
  rows.forEach(r => { map[r.Date] = r; });
  return map;
}

function renderSummary(dateMap) {
  const monthPrefix = `${currentYear}-${String(currentMonth + 1).padStart(2, "0")}`;
  const monthRows = Object.values(dateMap).filter(r => r.Date.startsWith(monthPrefix));
  renderStatsInto("summary", monthRows, "Net Profit (Month)");
}

function renderStatsInto(elId, rows, profitLabel) {
  const totalProfit = rows.reduce((sum, r) => sum + (r.netProfitV2 || 0), 0);
  const totalRevenue = rows.reduce((sum, r) => sum + (r.netRevenueV2 || 0), 0);
  const totalOrders = rows.reduce((sum, r) => sum + (r.ordersFloat || 0), 0);
  const winDays = rows.filter(r => (r.netProfitV2 || 0) > 0).length;

  const el = document.getElementById(elId);
  el.innerHTML = `
    <div class="stat">
      <div class="stat-label">${profitLabel}</div>
      <div class="stat-value ${totalProfit >= 0 ? "pos" : "neg"}">${formatMoney(totalProfit)}</div>
    </div>
    <div class="stat">
      <div class="stat-label">Net Revenue</div>
      <div class="stat-value">${formatMoney(totalRevenue)}</div>
    </div>
    <div class="stat">
      <div class="stat-label">Orders</div>
      <div class="stat-value">${totalOrders}</div>
    </div>
    <div class="stat">
      <div class="stat-label">Win Days</div>
      <div class="stat-value">${winDays} / ${rows.length}</div>
    </div>
  `;
}

function renderCalendar(dateMap) {
  const monthLabel = new Date(currentYear, currentMonth, 1).toLocaleDateString("en-US", { month: "long", year: "numeric" });
  document.getElementById("monthLabel").textContent = monthLabel;

  const firstDay = new Date(currentYear, currentMonth, 1).getDay();
  const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

  const gridEl = document.getElementById("grid");
  gridEl.innerHTML = "";

  for (let i = 0; i < firstDay; i++) {
    const empty = document.createElement("div");
    empty.className = "day empty";
    gridEl.appendChild(empty);
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    const record = dateMap[dateStr];
    const cell = document.createElement("div");

    if (!record || record.netProfitV2 === undefined || record.netProfitV2 === "") {
      cell.className = "day no-data";
      cell.innerHTML = `<div class="day-num">${d}</div>`;
    } else {
      const profit = record.netProfitV2;
      cell.className = "day " + (profit >= 0 ? "pos" : "neg");
      cell.innerHTML = `
        <div class="day-num">${d}</div>
        <div>
          <div class="day-value">${formatMoney(profit)}</div>
          <div class="day-orders">${record.ordersFloat || 0} orders</div>
        </div>
      `;
      cell.onclick = () => openDayModal(dateStr, record);
    }
    gridEl.appendChild(cell);
  }
}

function openDayModal(dateStr, record) {
  const dateObj = new Date(dateStr + "T00:00:00");
  const label = dateObj.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", year: "numeric" });
  document.getElementById("modalDate").textContent = label;

  const revenue = record.netRevenueV2 || 0;
  const cogs = record.cogsV2 || 0;
  const adSpend = record.totalAdSpend || 0;
  const profit = record.netProfitV2 || 0;
  const grossProfit = record.grossProfitV2 || 0;
  const orders = record.ordersFloat || 0;

  document.getElementById("modalBody").innerHTML = `
    <div class="modal-row"><div class="modal-row-label">Net Revenue</div><div class="modal-row-value">${formatMoneyFull(revenue)}</div></div>
    <div class="modal-row"><div class="modal-row-label">COGS</div><div class="modal-row-value">${formatMoneyFull(cogs)}</div></div>
    <div class="modal-row"><div class="modal-row-label">Ad Spend</div><div class="modal-row-value">${formatMoneyFull(adSpend)}</div></div>
    <div class="modal-row"><div class="modal-row-label">Gross Profit</div><div class="modal-row-value">${formatMoneyFull(grossProfit)}</div></div>
    <div class="modal-row"><div class="modal-row-label">Net Profit</div><div class="modal-row-value ${profit >= 0 ? "pos" : "neg"}">${formatMoneyFull(profit)}</div></div>
    <div class="modal-row"><div class="modal-row-label">Orders</div><div class="modal-row-value">${orders}</div></div>
  `;

  document.getElementById("modalOverlay").classList.add("open");
}

document.getElementById("modalClose").onclick = () => {
  document.getElementById("modalOverlay").classList.remove("open");
};

document.getElementById("modalOverlay").onclick = (e) => {
  if (e.target === e.currentTarget) {
    document.getElementById("modalOverlay").classList.remove("open");
  }
};

document.getElementById("rangeApply").onclick = () => {
  const start = document.getElementById("rangeStart").value;
  const end = document.getElementById("rangeEnd").value;
  if (!start || !end) return;

  const dateMap = getDataByDate();
  const rows = Object.values(dateMap).filter(r => r.Date >= start && r.Date <= end);
  renderStatsInto("rangeSummary", rows, "Net Profit (Range)");
};

document.getElementById("prevMonth").onclick = () => {
  currentMonth--;
  if (currentMonth < 0) { currentMonth = 11; currentYear--; }
  render();
};

document.getElementById("nextMonth").onclick = () => {
  currentMonth++;
  if (currentMonth > 11) { currentMonth = 0; currentYear++; }
  render();
};

function render() {
  buildTabs();
  const dateMap = getDataByDate();
  renderSummary(dateMap);
  renderCalendar(dateMap);
  const start = document.getElementById("rangeStart").value;
  const end = document.getElementById("rangeEnd").value;
  if (start && end) {
    const rows = Object.values(dateMap).filter(r => r.Date >= start && r.Date <= end);
    renderStatsInto("rangeSummary", rows, "Net Profit (Range)");
  } else {
    document.getElementById("rangeSummary").innerHTML = "";
  }
}

initTheme();

fetch("data.json")
  .then(res => res.json())
  .then(data => {
    allData = data;
    const blended = allData["Blended"] || [];
    if (blended.length > 0) {
      const dates = blended.map(r => r.Date).filter(Boolean).sort();
      const lastDateStr = dates[dates.length - 1];
      const [y, m] = lastDateStr.split("-").map(Number);
      currentYear = y;
      currentMonth = m - 1;
    }
    render();
  })
  .catch(err => {
    document.getElementById("grid").innerHTML = `<div style="padding:24px;color:var(--text-dim);grid-column:1/-1;">Couldn't load data.json — ${err}</div>`;
  });
</script>
</body>
</html>
