<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P&L Calendar</title>
<style>
  :root {
    --bg: #0b0d10;
    --panel: #14171b;
    --panel-border: #23272d;
    --text: #e8eaed;
    --text-dim: #8b929c;
    --green-bg: #10221a;
    --green-border: #1f6b41;
    --green-text: #4ade80;
    --red-bg: #26141a;
    --red-border: #7a2836;
    --red-text: #f87171;
    --neutral-bg: #17191d;
    --accent: #5b8cff;
    --font-display: 'DM Mono', 'SF Mono', 'Consolas', monospace;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    padding: 24px;
    min-height: 100vh;
  }

  .wrap {
    max-width: 1100px;
    margin: 0 auto;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 20px;
  }

  h1 {
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 500;
    letter-spacing: -0.02em;
    margin: 0;
    color: var(--text);
  }

  .tabs {
    display: flex;
    gap: 4px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 4px;
  }

  .tab {
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 600;
    padding: 7px 14px;
    border-radius: 7px;
    background: transparent;
    color: var(--text-dim);
    border: none;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }

  .tab:hover { color: var(--text); }

  .tab.active {
    background: var(--accent);
    color: #fff;
  }

  .summary-bar {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }

  .stat {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 14px 16px;
  }

  .stat-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    margin-bottom: 6px;
  }

  .stat-value {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 500;
  }

  .stat-value.pos { color: var(--green-text); }
  .stat-value.neg { color: var(--red-text); }

  .month-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-bottom: 14px;
  }

  .month-nav button {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text);
    width: 32px;
    height: 32px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .month-nav button:hover { background: var(--panel-border); }

  .month-label {
    font-family: var(--font-display);
    font-size: 15px;
    min-width: 160px;
    text-align: center;
  }

  .calendar {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    overflow: hidden;
  }

  .weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    border-bottom: 1px solid var(--panel-border);
  }

  .weekdays div {
    padding: 10px;
    text-align: center;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
  }

  .day {
    min-height: 78px;
    border-right: 1px solid var(--panel-border);
    border-bottom: 1px solid var(--panel-border);
    padding: 8px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .day:nth-child(7n) { border-right: none; }

  .day.empty { background: transparent; }
  .day.no-data { background: var(--neutral-bg); }

  .day.pos {
    background: var(--green-bg);
  }

  .day.neg {
    background: var(--red-bg);
  }

  .day-num {
    font-size: 11px;
    color: var(--text-dim);
  }

  .day-value {
    font-family: var(--font-display);
    font-size: 14px;
    font-weight: 600;
  }

  .day.pos .day-value { color: var(--green-text); }
  .day.neg .day-value { color: var(--red-text); }

  .day-orders {
    font-size: 10px;
    color: var(--text-dim);
  }

  footer {
    margin-top: 20px;
    text-align: center;
    font-size: 11px;
    color: var(--text-dim);
  }

  @media (max-width: 640px) {
    .summary-bar { grid-template-columns: repeat(2, 1fr); }
    .day { min-height: 60px; padding: 6px; }
    .day-value { font-size: 12px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>P&L Calendar</h1>
    <div class="tabs" id="tabs"></div>
  </header>

  <div class="summary-bar" id="summary"></div>

  <div class="month-nav">
    <button id="prevMonth">&#8249;</button>
    <div class="month-label" id="monthLabel"></div>
    <button id="nextMonth">&#8250;</button>
  </div>

  <div class="calendar">
    <div class="weekdays">
      <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <footer>Updated automatically once a day from Juicy P&amp;L data</footer>
</div>

<script>
let allData = {};
let currentTab = "Blended";
let currentMonth = new Date().getMonth();
let currentYear = new Date().getFullYear();

function formatMoney(n) {
  const sign = n < 0 ? "-" : "";
  const abs = Math.abs(n);
  if (abs >= 1000) return sign + "$" + (abs / 1000).toFixed(2) + "K";
  return sign + "$" + abs.toFixed(2);
}

function buildTabs() {
  const tabsEl = document.getElementById("tabs");
  tabsEl.innerHTML = "";
  const names = Object.keys(allData);
  // Put Blended first if present
  names.sort((a, b) => (a === "Blended" ? -1 : b === "Blended" ? 1 : 0));
  names.forEach(name => {
    const btn = document.createElement("button");
    btn.className = "tab" + (name === currentTab ? " active" : "");
    btn.textContent = name;
    btn.onclick = () => { currentTab = name; render(); };
    tabsEl.appendChild(btn);
  });
}

function getDataByDate() {
  const rows = allData[currentTab] || [];
  const map = {};
  rows.forEach(r => { map[r.Date] = r; });
  return map;
}

function renderSummary(dateMap) {
  const monthPrefix = `${currentYear}-${String(currentMonth + 1).padStart(2, "0")}`;
  const monthRows = Object.values(dateMap).filter(r => r.Date.startsWith(monthPrefix));

  const totalProfit = monthRows.reduce((sum, r) => sum + (r.netProfitV2 || 0), 0);
  const totalRevenue = monthRows.reduce((sum, r) => sum + (r.netRevenueV2 || 0), 0);
  const totalOrders = monthRows.reduce((sum, r) => sum + (r.ordersFloat || 0), 0);
  const winDays = monthRows.filter(r => (r.netProfitV2 || 0) > 0).length;

  const summaryEl = document.getElementById("summary");
  summaryEl.innerHTML = `
    <div class="stat">
      <div class="stat-label">Net Profit (Month)</div>
      <div class="stat-value ${totalProfit >= 0 ? "pos" : "neg"}">${formatMoney(totalProfit)}</div>
    </div>
    <div class="stat">
      <div class="stat-label">Net Revenue</div>
      <div class="stat-value">${formatMoney(totalRevenue)}</div>
    </div>
    <div class="stat">
      <div class="stat-label">Orders</div>
      <div class="stat-value">${totalOrders}</div>
    </div>
    <div class="stat">
      <div class="stat-label">Win Days</div>
      <div class="stat-value">${winDays} / ${monthRows.length}</div>
    </div>
  `;
}

function renderCalendar(dateMap) {
  const monthLabel = new Date(currentYear, currentMonth, 1).toLocaleDateString("en-US", { month: "long", year: "numeric" });
  document.getElementById("monthLabel").textContent = monthLabel;

  const firstDay = new Date(currentYear, currentMonth, 1).getDay();
  const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

  const gridEl = document.getElementById("grid");
  gridEl.innerHTML = "";

  for (let i = 0; i < firstDay; i++) {
    const empty = document.createElement("div");
    empty.className = "day empty";
    gridEl.appendChild(empty);
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    const record = dateMap[dateStr];
    const cell = document.createElement("div");

    if (!record || record.netProfitV2 === undefined || record.netProfitV2 === "") {
      cell.className = "day no-data";
      cell.innerHTML = `<div class="day-num">${d}</div>`;
    } else {
      const profit = record.netProfitV2;
      cell.className = "day " + (profit >= 0 ? "pos" : "neg");
      cell.innerHTML = `
        <div class="day-num">${d}</div>
        <div>
          <div class="day-value">${formatMoney(profit)}</div>
          <div class="day-orders">${record.ordersFloat || 0} orders</div>
        </div>
      `;
    }
    gridEl.appendChild(cell);
  }
}

function render() {
  buildTabs();
  const dateMap = getDataByDate();
  renderSummary(dateMap);
  renderCalendar(dateMap);
}

document.getElementById("prevMonth").onclick = () => {
  currentMonth--;
  if (currentMonth < 0) { currentMonth = 11; currentYear--; }
  render();
};

document.getElementById("nextMonth").onclick = () => {
  currentMonth++;
  if (currentMonth > 11) { currentMonth = 0; currentYear++; }
  render();
};

fetch("data.json")
  .then(res => res.json())
  .then(data => {
    allData = data;
    // Default to the most recent month that has data, in the Blended tab
    const blended = allData["Blended"] || [];
    if (blended.length > 0) {
      const lastDate = new Date(blended[blended.length - 1].Date);
      currentMonth = lastDate.getMonth();
      currentYear = lastDate.getFullYear();
    }
    render();
  })
  .catch(err => {
    document.getElementById("grid").innerHTML = `<div style="padding:24px;color:var(--text-dim);grid-column:1/-1;">Couldn't load data.json — ${err}</div>`;
  });
</script>
</body>
</html>
